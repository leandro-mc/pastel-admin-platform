name: CI
# Politica (docs/GIT_WORKFLOW.md, seccion 3): el CI NUNCA corre por commit, push ni por abrir o actualizar un PR.
# Solo corre (1) al aprobar un PR cuya base es dev, (2) al poner la etiqueta ci:basico o ci:completo en un PR hacia dev
# (alternativa para quien no puede aprobar su propio PR) y (3) a mano. Por defecto el alcance es BASICO (backend y
# frontend); PostgreSQL, contenedores y aislamiento por modulo solo con ci:completo o con alcance "completo".
on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      scope:
        description: "basico = backend y frontend; completo = ademas PostgreSQL, contenedores y aislamiento por modulo."
        required: true
        type: choice
        options: [basico, completo]
        default: basico

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && github.event.pull_request.base.ref == 'dev')
      || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'dev' && (github.event.label.name == 'ci:basico' || github.event.label.name == 'ci:completo'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Backend format, build, and unit tests in Docker
        shell: pwsh
        run: ./scripts/test-backend.ps1

  frontend:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && github.event.pull_request.base.ref == 'dev')
      || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'dev' && (github.event.label.name == 'ci:basico' || github.event.label.name == 'ci:completo'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Frontend format, lint, build, and design audits in Docker
        shell: pwsh
        run: ./scripts/test-frontend.ps1

  database-integration:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.scope == 'completo')
      || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'dev' && github.event.label.name == 'ci:completo')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_DB: pastel
      POSTGRES_USER: pastel
      POSTGRES_PASSWORD: ci-only-Postgres-Password-2026!
      JWT_SIGNING_KEY: ci-only-not-a-real-signing-key-keep-over-32-bytes-2026
      BOOTSTRAP_ADMIN_PASSWORD: ci-only-Bootstrap-Password-2026!
    steps:
      - uses: actions/checkout@v6
      - name: Run HTTP and PostgreSQL integration tests in Docker
        shell: pwsh
        run: ./scripts/test-database.ps1

  container-build:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.scope == 'completo')
      || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'dev' && github.event.label.name == 'ci:completo')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Disposable placeholders used only for Compose interpolation during image builds.
      POSTGRES_PASSWORD: ci-only-Postgres-Password-2026!
      POSTGRES_HOST: db
      JWT_SIGNING_KEY: ci-only-not-a-real-signing-key-keep-over-32-bytes-2026
      BOOTSTRAP_ADMIN_PASSWORD: ci-only-Bootstrap-Password-2026!
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build API and web images
        run: docker compose build
      - name: Start the stack and verify the initial database schema
        shell: bash
        run: |
          docker compose up -d
          for attempt in $(seq 1 40); do
            api_container="$(docker compose ps -q api)"
            api_health="unknown"
            if [ -n "$api_container" ]; then
              api_health="$(docker inspect --format '{{.State.Health.Status}}' "$api_container" 2>/dev/null || true)"
            fi
            modules_created="$(docker compose exec -T db psql -U pastel -d pastel -tAc "SELECT to_regclass('identity.modules') IS NOT NULL;" 2>/dev/null | tr -d '[:space:]' || true)"
            if [ "$api_health" = "healthy" ] && [ "$modules_created" = "t" ] && curl -fsS http://127.0.0.1:8080/health/web >/dev/null; then
              echo "API readiness is healthy, identity.modules exists, and the web container responds."
              docker compose down -v
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color api db web
          docker compose down -v
          exit 1

  # Comprueba que cada subapp puede compilarse sin el resto de módulos de negocio.
  # Identity permanece incluido por contrato en cada imagen backend.
  module-isolation:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.scope == 'completo')
      || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'dev' && github.event.label.name == 'ci:completo')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        module: [agora, brisa, balance, cosecha, huella]
    steps:
      - uses: actions/checkout@v6
      - name: Build backend subset
        run: docker build --file src/Host/Pastel.Host/Dockerfile --build-arg PASTEL_MODULES=${{ matrix.module }} --tag pastel-api:${{ matrix.module }} .
      - name: Build frontend subset
        run: docker build --file web/Dockerfile --build-arg PASTEL_MODULES=${{ matrix.module }} --tag pastel-web:${{ matrix.module }} .
