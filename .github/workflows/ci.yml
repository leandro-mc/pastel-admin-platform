name: CI
on:
  # Validate the active modular-foundation branch on each checkpoint push; other WIP branches stay quiet.
  push:
    branches: [main, dev, refactor/modular-foundation]
  pull_request:
    branches: [main, dev, refactor/modular-foundation]
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backend format, build, and unit tests in Docker
        shell: pwsh
        run: ./scripts/test-backend.ps1

  frontend:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Frontend format, lint, build, and design audits in Docker
        shell: pwsh
        run: ./scripts/test-frontend.ps1

  database-integration:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: pastel
      POSTGRES_USER: pastel
      POSTGRES_PASSWORD: ci-only-Postgres-Password-2026!
      JWT_SIGNING_KEY: ci-only-not-a-real-signing-key-keep-over-32-bytes-2026
      BOOTSTRAP_ADMIN_PASSWORD: ci-only-Bootstrap-Password-2026!
    steps:
      - uses: actions/checkout@v4
      - name: Run HTTP and PostgreSQL integration tests in Docker
        shell: pwsh
        run: ./scripts/test-database.ps1

  container-build:
    # Draft PRs are checkpoints, not validation requests. CI runs when marked ready.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      # Disposable placeholders used only for Compose interpolation during image builds.
      POSTGRES_PASSWORD: ci-only-Postgres-Password-2026!
      JWT_SIGNING_KEY: ci-only-not-a-real-signing-key-keep-over-32-bytes-2026
      BOOTSTRAP_ADMIN_PASSWORD: ci-only-Bootstrap-Password-2026!
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build API and web images
        run: docker compose build
      - name: Start the stack and verify the initial database schema
        shell: bash
        run: |
          docker compose up -d
          for attempt in $(seq 1 40); do
            api_running="$(docker compose ps --status running --services | grep -cx api || true)"
            modules_created="$(docker compose exec -T db psql -U pastel -d pastel -tAc "SELECT to_regclass('identity.modules') IS NOT NULL;" 2>/dev/null | tr -d '[:space:]' || true)"
            if [ "$api_running" -eq 1 ] && [ "$modules_created" = "t" ] && curl -fsS http://127.0.0.1:8080/health/web >/dev/null; then
              echo "API is running, identity.modules exists, and the web container responds."
              docker compose down -v
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color api db
          docker compose down -v
          exit 1