name: CI
on:
  push:
    branches: [main, dev, 'feat/**', 'fix/**', 'refactor/**', 'chore/**', 'docs/**', 'test/**']
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Pastel.slnx
      - run: dotnet build Pastel.slnx --configuration Release --no-restore
      - run: dotnet test Pastel.slnx --configuration Release --no-build --no-restore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run lint

  container-build:
    runs-on: ubuntu-latest
    env:
      # Disposable placeholders used only for Compose interpolation during image builds.
      POSTGRES_PASSWORD: ci-only-Postgres-Password-2026!
      JWT_SIGNING_KEY: ci-only-not-a-real-signing-key-keep-over-32-bytes-2026
      BOOTSTRAP_ADMIN_PASSWORD: ci-only-Bootstrap-Password-2026!
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build API and web images
        run: docker compose build
      - name: Start the stack and verify the initial database schema
        shell: bash
        run: |
          docker compose up -d
          for attempt in $(seq 1 40); do
            api_running="$(docker compose ps --status running --services | grep -cx api || true)"
            modules_created="$(docker compose exec -T db psql -U pastel -d pastel -tAc "SELECT to_regclass('public.\"Modules\"') IS NOT NULL;" 2>/dev/null | tr -d '[:space:]' || true)"
            if [ "$api_running" -eq 1 ] && [ "$modules_created" = "t" ] && curl -fsS http://127.0.0.1:8080/health/web >/dev/null; then
              echo "API is running, EF migrations created Modules, and the web container responds."
              docker compose down -v
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color api db
          docker compose down -v
          exit 1