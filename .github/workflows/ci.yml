name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Pastel.slnx
      # Explicit build catches compilation failures in non-test projects such as the API.
      - run: dotnet build Pastel.slnx --configuration Release --no-restore
      - run: dotnet test Pastel.slnx --configuration Release --no-build --no-restore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run lint

  container-build:
    runs-on: ubuntu-latest
    env:
      # Disposable placeholders used only for Compose interpolation during image builds.
      POSTGRES_PASSWORD: ci-only-Postgres-Password-2026!
      JWT_SIGNING_KEY: ci-only-not-a-real-signing-key-keep-over-32-bytes-2026
      BOOTSTRAP_ADMIN_PASSWORD: ci-only-Bootstrap-Password-2026!
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build API and web images
        run: docker compose build
