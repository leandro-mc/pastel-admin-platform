name: CodeQL
on:
  # Escaneo de seguridad opcional; mantener manual para no correr durante cada checkpoint.
  workflow_dispatch:
    inputs:
      confirm_scan:
        description: "Confirmo que deseo ejecutar el análisis CodeQL de esta rama."
        required: true
        type: boolean
        default: false

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    if: inputs.confirm_scan == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build .NET for analysis
        if: matrix.language == 'csharp'
        run: dotnet build Pastel.slnx --configuration Release
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
