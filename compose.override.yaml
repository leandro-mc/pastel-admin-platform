# Desarrollo local: Compose carga este archivo automáticamente junto con compose.yaml.
# Para usar PostgreSQL externo, ejecute "docker compose -f compose.yaml ..." sin este override.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pastel}
      POSTGRES_USER: ${POSTGRES_USER:-pastel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pastel} -d ${POSTGRES_DB:-pastel}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - pastel_net
    # El entrypoint oficial necesita poder preparar permisos y cambiar a postgres al inicializar el volumen.
    # Este servicio es solo de desarrollo y el puerto se publica exclusivamente en loopback.
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.00
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-pastel};Username=${POSTGRES_USER:-pastel};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD};GSS Encryption Mode=Disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
