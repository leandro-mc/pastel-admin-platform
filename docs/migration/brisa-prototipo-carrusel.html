<div class="app" id="appRoot">
  <header class="topbar">
    <button class="icon-button mobile-menu" id="mobileMenu" aria-label="Abrir navegación" title="Navegación"><span class="icon" data-icon="menu"></span></button>
    <div class="topbrand"><div class="brandmark"><span class="icon" data-icon="list-checks"></span></div><div class="brandcopy"><strong>PASTEL</strong><span>Tu espacio de trabajo</span></div></div>
    <div class="top-divider"></div>
    <div class="breadcrumb"><span>Aplicaciones</span><span class="icon" data-icon="chevron-right" style="width:14px;height:14px"></span><strong>Brisa</strong></div>
    <div class="top-actions">
      <button class="icon-button" id="openSearch" aria-label="Buscar tareas" title="Buscar tareas"><span class="icon" data-icon="search"></span></button>
      <button class="icon-button" id="themeToggle" aria-label="Activar modo oscuro" title="Cambiar tema"><span class="icon" data-icon="moon"></span></button>
      <button class="icon-button" id="openSettingsTop" aria-label="Configuración" title="Configuración"><span class="icon" data-icon="settings"></span></button>
      <button class="avatar-button" id="profileMenu" aria-label="Preferencias de usuario"><span class="avatar">LM</span><span class="avatar-meta"><strong>Mi espacio</strong><small>Preferencias</small></span><span class="icon" data-icon="chevron-down" style="width:15px;height:15px;color:var(--muted)"></span></button>
    </div>
  </header>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div><div class="side-label">Tu espacio</div><nav class="side-nav" aria-label="Navegación de Brisa">
        <button class="nav-item active" data-view="week"><span class="icon" data-icon="calendar-days"></span>Semana</button>
        <button class="nav-item" data-view="month"><span class="icon" data-icon="calendar"></span>Mes</button>
        <button class="nav-item" data-view="overdue"><span class="icon" data-icon="calendar-clock"></span>Vencidas<span class="nav-count" id="overdueNavCount">0</span></button>
        <button class="nav-item" data-view="deadlines"><span class="icon" data-icon="flag"></span>Fechas límite</button>
      </nav></div>
      <div><div class="side-label">Herramientas</div><nav class="side-nav" aria-label="Herramientas">
        <button class="nav-item" data-view="import"><span class="icon" data-icon="file-up"></span>Importar tareas</button>
        <button class="nav-item" data-view="settings"><span class="icon" data-icon="settings"></span>Configuración</button>
      </nav></div>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-note"><div class="note-mark"><span class="icon" data-icon="sprout"></span></div><strong>Tus días, con calma.</strong><p>Un pendiente a la vez. Lo importante también puede ir a su ritmo.</p></div>
      <div class="sidebar-bottom"><span>Brisa · Prototipo</span><span class="icon" data-icon="leaf" style="width:16px;height:16px"></span></div>
    </aside>
    <main class="main" id="mainContent" tabindex="-1"></main>
  </div>
  <nav class="bottom-nav" aria-label="Navegación móvil">
    <button data-view="week" class="active"><span class="icon" data-icon="calendar-days"></span><span>Semana</span></button>
    <button data-view="month"><span class="icon" data-icon="calendar"></span><span>Mes</span></button>
    <button data-view="overdue"><span class="icon" data-icon="calendar-clock"></span><span>Vencidas</span></button>
    <button data-view="deadlines"><span class="icon" data-icon="flag"></span><span>Límites</span></button>
  </nav>
</div>

function dateFromInstant(value,zone){if(!value)return null;try{const parts=new Intl.DateTimeFormat('en-CA',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(value));const o=Object.fromEntries(parts.map(p=>[p.type,p.value]));return `${o.year}-${o.month}-${o.day}`}catch{return dateLocal(new Date(value))}}
function normalize(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uuid(){return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)})}

let today='',tasks=[],prefs={},state={view:'week',focus:'',month:'',modal:null,editor:null,searchText:'',importPreview:null,lastImport:null,importFileName:'',mobileNav:false};
function load(){try{const x=JSON.parse(storageGet(STORE)||'null');if(x&&Array.isArray(x.tasks))tasks=x.tasks;else tasks=sampleTasks(today);prefs=JSON.parse(storageGet(PREFS)||'{}')||{};if(!prefs.timeZone)prefs.timeZone='America/Costa_Rica';if(!prefs.textSize)prefs.textSize='normal';if(!prefs.theme)prefs.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';state.view=prefs.view||'week';state.focus=prefs.focus||today;state.month=prefs.month||`${today.slice(0,7)}-01`;state.lastImport=prefs.lastImport||null;if(!storageGet(STORE))saveTasks()}catch{tasks=sampleTasks(today);prefs={timeZone:'America/Costa_Rica',textSize:'normal',theme:'light'};state.focus=today;state.month=`${today.slice(0,7)}-01`;saveTasks()}}
function saveTasks(){storageSet(STORE,JSON.stringify({tasks,prototype:true,updatedAt:new Date().toISOString()}))}
function savePrefs(){prefs.view=state.view;prefs.focus=state.focus;prefs.month=state.month;prefs.lastImport=state.lastImport;storageSet(PREFS,JSON.stringify(prefs))}
function visibleTasks(){return tasks.filter(t=>!t.deletedAt)}
function pendingTasks(){return visibleTasks().filter(t=>!t.completed)}
function overdueTasks(){return pendingTasks().filter(t=>{const e=effectiveDate(t);return t.dueDate?t.dueDate<today:e<today}).sort((a,b)=>((a.dueDate||effectiveDate(a)).localeCompare(b.dueDate||effectiveDate(b)))||(PRIORITIES[b.priority]?.rank||0)-(PRIORITIES[a.priority]?.rank||0))}
function deadlineTasks(){return visibleTasks().filter(t=>t.dueDate&&!(t.completed&&t.dueDate<today)).sort((a,b)=>(Number(a.completed)-Number(b.completed))||a.dueDate.localeCompare(b.dueDate)||((PRIORITIES[b.priority]?.rank||0)-(PRIORITIES[a.priority]?.rank||0)))}
function effectiveDate(task){const base=task.scheduledDate;if(task.completed&&!task.completedAt)return base;const ref=task.completed?dateFromInstant(task.completedAt,prefs.timeZone||'America/Costa_Rica'):today;if(!task.dueDate)return base;if(base>=ref)return base;if(task.dueDate>=ref)return ref;return base>task.dueDate?base:task.dueDate}
function taskSort(a,b,done=false){return (PRIORITIES[b.priority]?.rank||0)-(PRIORITIES[a.priority]?.rank||0)||(done?b.createdAt-a.createdAt:a.createdAt-b.createdAt)}
function getWeekDates(){return Array.from({length:7},(_,i)=>addDays(state.focus,i-2))}
function tasksForDate(date,done){return visibleTasks().filter(t=>t.completed===done&&effectiveDate(t)===date).sort((a,b)=>taskSort(a,b,done))}
function countWeek(){const dates=getWeekDates();let open=0,done=0;visibleTasks().forEach(t=>{if(dates.includes(effectiveDate(t))){if(t.completed)done++;else open++}});return {open,done}}
function cardStyle(t){return `--task-color:${COLORS.find(c=>c.hex.toLowerCase()===String(t.colorHex).toLowerCase())?.hex||'#DDE8D5'}`}
function priorityLabel(priority){const p=PRIORITIES[priority]||PRIORITIES.MEDIUM;return `<span class="priority-label"><i class="priority-dot" style="--priority-color:${p.color}"></i>Prioridad ${p.label.toLowerCase()}</span>`}
function pageTitle(title,desc,actions=''){return `<div class="page-head"><div><div class="eyebrow">BRISA · TUS PENDIENTES</div><h1>${title}</h1><p>${desc}</p></div>${actions?`<div class="page-actions">${actions}</div>`:''}</div>`}
function fabButton(){return `<button class="btn btn-primary" data-action="new-today">${icon('plus')}Nueva tarea</button>`}
function dayTaskCard(t){return `<article class="task-card ${t.completed?'is-done':''}" style="${cardStyle(t)}"><button class="task-title-button" data-action="edit" data-id="${t.id}" aria-label="Editar: ${escapeHtml(t.title)}">${escapeHtml(t.title)}</button><div class="task-meta"><span class="task-priority"><i class="priority-dot" style="--priority-color:${(PRIORITIES[t.priority]||PRIORITIES.MEDIUM).color}"></i>${(PRIORITIES[t.priority]||PRIORITIES.MEDIUM).label.toUpperCase()}</span>${t.completed?'<span>· HECHA</span>':''}</div>${t.dueDate?`<div class="task-due">${icon('flag','icon')}Límite ${escapeHtml(labelDate(t.dueDate,'short'))}</div>`:''}<div class="task-bottom"><button class="task-action" data-action="toggle" data-id="${t.id}" aria-label="${t.completed?'Marcar como pendiente':'Marcar como hecha'}: ${escapeHtml(t.title)}" title="${t.completed?'Marcar como pendiente':'Marcar como hecha'}">${icon(t.completed?'check-check':'check-circle')}${t.completed?'Hecha':'Hecha'}</button><button class="task-action open-task" data-action="edit" data-id="${t.id}" aria-label="Editar tarea ${escapeHtml(t.title)}" title="Editar">${icon('edit')}</button></div></article>`}
function emptyInline(text){return `<div class="mini-empty">${escapeHtml(text)}</div>`}
function renderWeek(){const dates=getWeekDates(),cnt=countWeek(),start=labelDate(dates[0],'short'),end=labelDate(dates[6],'short');return `${pageTitle('Tu semana','Un día a la vez. Aquí tienes tus pendientes para avanzar a tu ritmo.',fabButton())}<section class="panel toolbar"><div class="toolbar-title"><span class="icon" style="color:var(--accent-strong)">${icon('calendar-days')}</span><div><h2>Tu semana</h2><p>${start} – ${end}</p></div></div><div class="toolbar-actions"><button class="btn btn-small" data-action="today">Ir a hoy</button><button class="icon-button" data-action="focus-prev" aria-label="Un día atrás" title="Un día atrás">${icon('chevron-left')}</button><span class="date-range">${escapeHtml(labelDate(state.focus,'short'))}</span><button class="icon-button" data-action="focus-next" aria-label="Un día adelante" title="Un día adelante">${icon('chevron-right')}</button></div></section><div class="stat-row"><span class="stat-chip"><i class="tiny-dot"></i><strong>${cnt.open}</strong> por hacer</span><span class="stat-chip">${icon('check-circle')}<strong>${cnt.done}</strong> hechas</span><span class="stat-chip">${icon('calendar')}<strong>${visibleTasks().length}</strong> en total</span></div><section class="week-grid" aria-label="Siete días de tareas">${dates.map(date=>{const open=tasksForDate(date,false),done=tasksForDate(date,true),isToday=date===today,isFocus=date===state.focus;return `<div class="day-column ${isFocus?'focused':''} ${isToday?'today':''}"><div class="day-head"><button class="day-focus" data-action="focus-day" data-date="${date}" aria-label="Enfocar ${labelDate(date)}"><span class="day-weekday">${escapeHtml(labelDate(date,'weekday'))}</span><span class="day-number">${Number(date.slice(-2))}</span><span class="day-sub">${isToday?'<span class="today-label">HOY</span>':`${open.length+done.length} ${open.length+done.length===1?'tarea':'tareas'}`}</span></button><button class="day-add" data-action="new-date" data-date="${date}" aria-label="Crear tarea para ${escapeHtml(labelDate(date))}" title="Crear tarea para ${escapeHtml(labelDate(date))}">${icon('plus')}</button></div><div class="day-tasks">${open.length?open.map(dayTaskCard).join(''):emptyInline('Sin tareas')}${done.length?`<div class="section-separator">HECHAS</div>${done.map(dayTaskCard).join('')}`:''}</div></div>`}).join('')}</section><div class="week-hint">${icon('info')}<span>Desliza horizontalmente con el trackpad, usa Shift + rueda del mouse o mantén presionado y arrastra para recorrer los días. La rueda vertical sigue desplazando la página. También puedes usar las flechas o tocar “+” para crear una tarea en esa fecha.</span></div>`}
function renderMonth(){const [year,month]=state.month.split('-').map(Number),n=monthDays(state.month),offset=(new Date(Date.UTC(year,month-1,1,12)).getUTCDay()+6)%7,total=Math.ceil((offset+n)/7)*7,all=visibleTasks();let cells='';for(let i=0;i<total;i++){const d=i-offset+1;let date,inside=true;if(d<1){date=addDays(state.month,d-1);inside=false}else if(d>n){date=addDays(`${year}-${String(month).padStart(2,'0')}-${String(n).padStart(2,'0')}`,d-n);inside=false}else date=`${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const count=all.filter(t=>effectiveDate(t)===date).length,isToday=date===today;cells+=`<button class="month-day ${inside?'':'outside'} ${isToday?'is-today':''}" data-action="month-pick" data-date="${date}" aria-label="${labelDate(date)}${count?`, ${count} tareas`:''}"><span class="num">${Number(date.slice(-2))}</span>${isToday?'<span class="today-mini">HOY</span>':count?`<span class="count ${count>9?'over-nine':''}">${count>99?'99+':count}</span>`:''}</button>`}const monthTasks=all.filter(t=>effectiveDate(t).slice(0,7)===state.month.slice(0,7)).length;return `${pageTitle('Tu calendario','Elige un día para ver sus pendientes.',fabButton())}<section class="panel month-panel"><div class="month-bar"><div class="month-title"><h2>${escapeHtml(labelDate(state.month,'month'))}</h2><p>Tu mes, de lunes a domingo.</p></div><div class="toolbar-actions"><button class="icon-button" data-action="month-prev" aria-label="Mes anterior" title="Mes anterior">${icon('chevron-left')}</button><button class="icon-button" data-action="month-next" aria-label="Mes siguiente" title="Mes siguiente">${icon('chevron-right')}</button></div></div><div class="month-grid">${['L','M','X','J','V','S','D'].map(x=>`<div class="weekday-head">${x}</div>`).join('')}${cells}</div><div class="month-footer"><span>${monthTasks} ${monthTasks===1?'tarea':'tareas'} este mes</span><span>Selecciona un día para abrir su semana.</span></div></section>`}
function renderCollection(kind){const overdue=kind==='overdue',list=overdue?overdueTasks():deadlineTasks(),title=overdue?'Pendientes atrasados':'Fechas límite',desc=overdue?'Puedes mover cualquier tarea a otro día sin perder sus detalles.':'Las fechas más próximas aparecen primero.';const emptyTitle=overdue?'Vas al día':'Sin fechas límite',emptyDesc=overdue?'No tienes tareas pendientes de días anteriores.':'Cuando una tarea tenga fecha límite, aparecerá aquí en orden de vencimiento.';return `${pageTitle(title,desc,fabButton())}<section class="panel collection-panel"><header class="collection-head"><div><h2>${overdue?(list.length===0?'Todo al día':`${list.length} ${list.length===1?'tarea':'tareas'}`):`${list.length} ${list.length===1?'fecha límite':'fechas límite'}`}</h2><p>${overdue?'Ordenadas por vencimiento y prioridad.':'Pendientes primero; las hechas quedan al final.'}</p></div><span class="pill">${overdue?'VENCIDAS':'POR FECHA'}</span></header>${list.length?`<div class="collection-list">${list.map(t=>{const ed=effectiveDate(t),isOverdue=!t.completed&&t.dueDate&&t.dueDate<today;return `<article class="collection-item" style="--task-color:${COLORS.find(c=>c.hex.toLowerCase()===String(t.colorHex).toLowerCase())?.hex||'#DDE8D5'}"><span class="collection-bar"></span><div class="collection-content"><div class="collection-kicker">${overdue?'PROGRAMADA PARA':isOverdue?'VENCIDA':'FECHA LÍMITE'}</div><div class="collection-date">${escapeHtml(labelDate(overdue?ed:t.dueDate))}</div><div class="collection-title ${t.completed?'done':''}">${escapeHtml(t.title)}</div>${t.details?`<div class="collection-notes">${escapeHtml(t.details)}</div>`:''}<div class="collection-meta">${priorityLabel(t.priority)}${t.dueDate?`<span>· Límite ${escapeHtml(labelDate(t.dueDate,'short'))}</span>`:''}${t.completed?'<span class="state-badge done">Hecha</span>':isOverdue?'<span class="state-badge overdue">Vencida</span>':''}</div></div><div class="collection-actions"><button class="btn btn-small ${t.completed?'':'btn-soft'}" data-action="toggle" data-id="${t.id}" aria-label="${t.completed?'Marcar como pendiente':'Marcar como hecha'}: ${escapeHtml(t.title)}">${icon(t.completed?'history':'check-circle')}${t.completed?'Reabrir':'Marcar hecha'}</button><button class="icon-button" data-action="edit" data-id="${t.id}" aria-label="Editar ${escapeHtml(t.title)}" title="Editar">${icon('edit')}</button></div></article>`}).join('')}</div>`:`<div class="empty-state"><div class="empty-illustration">${icon(overdue?'sprout':'calendar-check')}</div><h3>${emptyTitle}</h3><p>${emptyDesc}</p>${overdue?'<button class="btn btn-soft" data-action="new-today">Crear una tarea</button>':''}</div>`}</section>`}

serva el identificador original. Reimportar no crea una segunda tarea.</div><div class="import-result"><strong>Sin sobrescrituras:</strong> un ID existente con contenido diferente se omite y se informa.</div><div class="import-result"><strong>Respaldo automático:</strong> conserva el estado anterior en el navegador antes de importar.</div></div><div class="field-help" style="margin-top:15px">Este prototipo guarda datos en el navegador local. No sustituye las garantías transaccionales del backend PostgreSQL real.</div>${state.lastImport?`<div class="last-import"><div><strong>Última importación</strong><div class="field-help">${escapeHtml(state.lastImport.when)} · ${state.lastImport.created} creadas</div></div><button class="btn btn-small" data-action="rollback-import">Revertir lote</button></div>`:''}</section></div>`}
function renderSettings(){const tz=prefs.timeZone||'America/Costa_Rica',size=prefs.textSize||'normal',theme=prefs.theme||'light';return `${pageTitle('Configuración','Ajusta Brisa para que acompañe tu ritmo y tu forma de organizarte.')}<div class="settings-grid"><section class="panel settings-card"><h2>${icon('globe')}Fecha y zona horaria</h2><p>Brisa trabaja con días completos, nunca con horas de tareas. La zona horaria determina cuándo comienza “hoy” y cuándo avanzan las tareas con fecha límite.</p><div class="field"><label for="timeZone">Tu zona horaria</label><select class="select" id="timeZone"><option value="America/Costa_Rica">Costa Rica — America/Costa_Rica</option><option value="America/Mexico_City">Ciudad de México — America/Mexico_City</option><option value="America/New_York">Nueva York — America/New_York</option><option value="America/Los_Angeles">Los Ángeles — America/Los_Angeles</option><option value="America/Bogota">Bogotá — America/Bogota</option><option value="America/Panama">Panamá — America/Panama</option><option value="Europe/Madrid">Madrid — Europe/Madrid</option><option value="UTC">UTC</option></select><span class="field-help">Hoy en tu zona: <strong>${escapeHtml(labelDate(today))}</strong>. Cambiar la zona no modifica las fechas guardadas.</span></div><button class="btn btn-primary" data-action="save-timezone">Guardar zona horaria</button></section><section class="panel settings-card"><h2>${icon('type')}Lectura y apariencia</h2><p>Elige un tamaño de texto cómodo y la apariencia que prefieras. Tu selección se conserva en este navegador.</p><div class="field"><span class="field-label">Tamaño de texto</span><div class="choice-row"><button class="choice" data-size="normal" aria-pressed="${size==='normal'}">Normal</button><button class="choice" data-size="large" aria-pressed="${size==='large'}">Grande</button><button class="choice" data-size="xlarge" aria-pressed="${size==='xlarge'}">Muy grande</button></div></div><div class="field"><span class="field-label">Tema</span><div class="choice-row"><button class="choice" data-theme-choice="light" aria-pressed="${theme==='light'}">${icon('sun')} Claro</button><button class="choice" data-theme-choice="dark" aria-pressed="${theme==='dark'}">${icon('moon')} Oscuro</button></div><span class="field-help">La primera visita respeta el tema del sistema; después se recuerda tu preferencia.</span></div><button class="btn btn-primary" data-action="save-display">Guardar preferencias</button></section><section class="panel settings-card"><h2>${icon('database')}Tus datos de prueba</h2><p>Este prototipo utiliza información ilustrativa que solo vive en el navegador. Todavía no está conectado al backend.</p><div class="import-results"><div class="import-result"><strong>${visibleTasks().length}</strong> tareas guardadas en este navegador</div><div class="import-result"><strong>${pendingTasks().length}</strong> pendientes sin marcar como hechas</div><div class="import-result"><strong>${tasks.filter(t=>t.deletedAt).length}</strong> eliminadas lógicamente, ocultas de tus vistas</div></div><div class="page-actions" style="justify-content:flex-start;margin-top:14px"><button class="btn btn-primary" data-action="goto-import">${icon('file-up')}Importar tareas</button><button class="btn" data-action="download-sample">${icon('download')}Descargar ejemplo</button><button class="btn btn-danger" data-action="reset-demo">Restablecer demo</button></div></section><section class="panel settings-card"><h2>${icon('info')}Sobre Brisa</h2><p>Un pendiente a la vez, con calma. El prototipo reúne las vistas y flujos del inventario funcional antes de conectar la aplicación al backend.</p><div class="import-results"><div class="import-result">No hay hora del día, recurrencias, recordatorios ni notificaciones en el alcance actual.</div><div class="import-result">Las tareas y preferencias del prototipo se guardan localmente con <code>localStorage</code>.</div></div></section></div>`}

let weekCarouselLeft=null;
let weekCarouselFocus=null;
function enableWeekCarousel(){
 const track=$('.week-grid');
 if(!track)return;
 track.tabIndex=0;
 track.setAttribute('role','region');
 track.setAttribute('aria-roledescription','carrusel');
 track.setAttribute('aria-label','Carrusel de días de la semana. Desliza horizontalmente para recorrer las fechas. El scroll vertical sigue desplazando la página; con Shift + rueda puedes recorrer los días.');
 const focusDate=state.focus;
 const focused=track.querySelector('.day-column.focused');
 requestAnimationFrame(()=>{
  if(!track.isConnected)return;
  if(weekCarouselFocus===focusDate&&Number.isFinite(weekCarouselLeft)){
   track.scrollLeft=weekCarouselLeft;
  }else if(focused){
   const cardRect=focused.getBoundingClientRect(),trackRect=track.getBoundingClientRect();
   track.scrollLeft+=cardRect.left-trackRect.left-(track.clientWidth-cardRect.width)/2;
  }
  weekCarouselFocus=focusDate;
  weekCarouselLeft=track.scrollLeft;
 });
 track.addEventListener('scroll',()=>{
  weekCarouselLeft=track.scrollLeft;
  weekCarouselFocus=focusDate;
 },{passive:true});
 // Keep ordinary vertical wheel scrolling available for the whole page.
 // Use Shift + wheel for horizontal navigation when working with a mouse.
 track.addEventListener('wheel',e=>{
  if(!e.shiftKey||track.scrollWidth<=track.clientWidth+2)return;
  if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){
   e.preventDefault();
   track.scrollLeft+=e.deltaY;
  }
 },{passive:false});
 track.addEventListener('keydown',e=>{
  if(e.target!==track)return;
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
   e.preventDefault();
   const card=track.querySelector('.day-column');
   const amount=(card?.getBoundingClientRect().width||260)+12;
   track.scrollBy({left:e.key==='ArrowRight'?amount:-amount,behavior:'smooth'});
  }
 });
 let pointerId=null,startX=0,startScroll=0,moved=false,suppressClick=false;
 let moveHandler=null,finishHandler=null;
 track.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='mouse'||e.button!==0||pointerId!==null)return;
  pointerId=e.pointerId;startX=e.clientX;startScroll=track.scrollLeft;moved=false;
  moveHandler=moveEvent=>{
   if(pointerId===null||moveEvent.pointerId!==pointerId)return;
   const delta=moveEvent.clientX-startX;
   if(!moved&&Math.abs(delta)>5){moved=true;track.classList.add('is-dragging');}
   if(moved){track.scrollLeft=startScroll-delta;moveEvent.preventDefault();}
  };
  finishHandler=finishEvent=>{
   if(pointerId===null||(finishEvent&&finishEvent.pointerId!==pointerId))return;
   const didMove=moved;
   pointerId=null;moved=false;track.classList.remove('is-dragging');
   window.removeEventListener('pointermove',moveHandler);
   window.removeEventListener('pointerup',finishHandler);
   window.removeEventListener('pointercancel',finishHandler);
   moveHandler=null;finishHandler=null;
   if(didMove){
    suppressClick=true;
    window.setTimeout(()=>{suppressClick=false;},350);
   }
  };
  window.addEventListener('pointermove',moveHandler,{passive:false});
  window.addEventListener('pointerup',finishHandler);
  window.addEventListener('pointercancel',finishHandler);
 });
 track.addEventListener('click',e=>{
  if(!suppressClick)return;
  e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();suppressClick=false;
 },true);
}

function openSearch(){state.modal={type:'search'};showModal(`<header class="modal-head"><div><h2 id="modalTitle">Buscar tareas</h2><p>Busca en tus títulos y notas, aunque escribas sin tildes.</p></div><button class="icon-button" data-search-close aria-label="Cerrar búsqueda">${icon('x')}</button></header><div class="modal-body"><div class="search-shell">${icon('search')}<input id="searchInput" type="search" placeholder="¿Qué necesitas encontrar?" autocomplete="off" aria-label="Buscar tareas"><span class="pill">Esc</span></div><div class="search-meta" id="searchMeta">Escribe para ver tus tareas.</div><div class="search-results" id="searchResults"></div></div>`,{wide:true});$('[data-search-close]',$('#modalRoot')).onclick=closeModal;const inp=$('#searchInput');inp.addEventListener('input',renderSearchResults);inp.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});setTimeout(()=>inp.focus(),40)}
function renderSearchResults(){const q=normalize($('#searchInput')?.value||'');const results=$('#searchResults'),meta=$('#searchMeta');if(!results)return;const hits=q?visibleTasks().filter(t=>normalize(`${t.title} ${t.details}`).includes(q)).sort((a,b)=>Number(a.completed)-Number(b.completed)||a.scheduledDate.localeCompare(b.scheduledDate)):[];meta.textContent=q?`${hits.length} ${hits.length===1?'resultado':'resultados'} · tareas propias, incluidas las hechas.`:'Escribe para ver tus tareas.';results.innerHTML=hits.length?hits.map(t=>`<div class="search-result"><span class="search-color" style="background:${COLORS.find(c=>c.hex.toLowerCase()===String(t.colorHex).toLowerCase())?.hex||'#DDE8D5'}"></span><button class="search-result-main" data-action="edit" data-id="${t.id}" style="background:none;border:0;text-align:left;padding:0;color:inherit"><strong>${escapeHtml(t.title)}</strong><small>${escapeHtml(labelDate(effectiveDate(t)))} · ${t.completed?'Hecha':'Pendiente'}${t.dueDate?' · Límite '+labelDate(t.dueDate,'short'):''}</small></button><button class="btn btn-small" data-action="toggle" data-id="${t.id}" aria-label="${t.completed?'Reabrir':'Marcar hecha'}">${icon(t.completed?'history':'check-circle')}</button></div>`).join(''):q?`<div class="empty-state"><div class="empty-illustration">${icon('search')}</div><h3>No encontramos esa tarea</h3><p>Prueba con otra palabra o busca una parte del título o de las notas.</p></div>`:'';paintIcons(results)}
const sampleJson=()=>JSON.stringify([{id:'7d1f3a52-9c40-4e6b-8a17-2b5c0e9d4f01',title:'Llamar al banco',details:'',scheduledDate:today,priority:'HIGH',colorHex:'#F6DDCE',dueDate:'',completed:false,createdAt:Date.now()-100000},{id:'a3c8e2b9-51d7-4f06-9b3e-6e1a7c2d8f02',title:'Enviar informe mensual',details:'Revisar cifras de cierre.',scheduledDate:addDays(today,-3),priority:'MEDIUM',colorHex:'#DCEAF4',dueDate:addDays(today,2),completed:false,createdAt:Date.now()-200000},{id:'5e9b0c47-2a8d-4d13-a6f5-3c7b1e0a9d03',title:'Ordenar el escritorio',details:'',scheduledDate:addDays(today,-2),priority:'LOW',colorHex:'#E5EDC8',dueDate:'',completed:false,createdAt:Date.now()-300000},{id:'c2406d8e-7b1f-4a95-8e2c-9d5f3a1b6e04',title:'Pagar el recibo de agua',details:'Guardar comprobante.',scheduledDate:addDays(today,-4),priority:'HIGH',colorHex:'#F5E9B9',dueDate:addDays(today,-2),completed:true,createdAt:Date.now()-400000},{id:'e81a5f30-6c9d-4b27-b4a8-1f2e7d0c5a05',title:'Revisar presupuesto',details:'Incluye ajustes del mes.',scheduledDate:addDays(today,-4),priority:'MEDIUM',colorHex:'#D4E9E1',dueDate:addDays(today,-1),completed:false,createdAt:Date.now()-500000}],null,2);
function parseImport(text){let data;try{data=JSON.parse(text)}catch{return {errors:['El archivo no contiene JSON válido. Revisa comas, comillas y corchetes.'],warnings:[],records:[]}}if(data&&!Array.isArray(data)&&data.format==='brisa-export'&&Array.isArray(data.tasks))data=data.tasks;if(!Array.isArray(data))return {errors:['El JSON debe ser un arreglo de tareas o un objeto brisa-export con tasks.'],warnings:[],records:[]};const errors=[],warnings=[],records=[],ids=new Set();data.forEach((raw,index)=>{const row=index+1;const errs=[];if(!raw||typeof raw!=='object'||Array.isArray(raw)){errors.push(`Registro ${row}: debe ser un objeto JSON.`);return}const id=String(raw.id||'');if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(id))errs.push('id debe ser un UUID válido');if(ids.has(id))errs.push('id duplicado dentro del archivo');ids.add(id);const title=String(raw.title??'').trim(),details=String(raw.details??'').trim(),scheduledDate=String(raw.scheduledDate??''),dueText=raw.dueDate==null?'':String(raw.dueDate),dueDate=dueText===''?null:dueText;const color=String(raw.colorHex??'#DDE8D5');if(!title)errs.push('title es obligatorio');if(title.length>150)errs.push('title supera 150 caracteres');if(details.length>2000)errs.push('details supera 2000 caracteres');if(!isoDateValid(scheduledDate))errs.push('scheduledDate debe tener formato AAAA-MM-DD y ser una fecha real');if(dueDate&&!isoDateValid(dueDate))errs.push('dueDate debe tener formato AAAA-MM-DD y ser una fecha real');if(dueDate&&isoDateValid(dueDate)&&isoDateValid(scheduledDate)&&dueDate<scheduledDate)errs.push('dueDate no puede ser anterior a scheduledDate');if(!/^#[0-9A-Fa-f]{6}$/.test(color))errs.push('colorHex debe tener formato #RRGGBB');if(raw.completed!==undefined&&typeof raw.completed!=='boolean')errs.push('completed debe ser booleano');if(errs.length){errors.push(`Registro ${row}: ${errs.join('; ')}.`);return}let priority=String(raw.priority??'MEDIUM').toUpperCase();if(!['LOW','MEDIUM','HIGH'].includes(priority)){warnings.push(`Registro ${row} (${title}): prioridad desconocida; se importará como Media.`);priority='MEDIUM'}let createdAt=Number(raw.createdAt);if(!Number.isFinite(createdAt)||createdAt<=0){createdAt=Date.now();warnings.push(`Registro ${row} (${title}): createdAt ausente o inválido; se asignará la fecha actual.`)}records.push({id,title,details,scheduledDate,priority,colorHex:color.toUpperCase(),dueDate,completed:!!raw.completed,createdAt,completedAt:null,deletedAt:null,importBatchId:null})});return {errors,warnings,records,total:data.length}}
function contentSignature(t){return JSON.stringify({title:t.title,details:t.details||'',scheduledDate:t.scheduledDate,priority:t.priority||'MEDIUM',colorHex:String(t.colorHex||'#DDE8D5').toUpperCase(),dueDate:t.dueDate||null,completed:!!t.completed,createdAt:Number(t.createdAt)||0})}
function previewImport(){const raw=$('#importJson')?.value||'';if(!raw.trim()){toast('Selecciona un archivo o pega el JSON que quieres importar.','error');return}const parsed=parseImport(raw);const current=tasks,created=[],existing=[],different=[];if(!parsed.errors.length){parsed.records.forEach(r=>{const found=current.find(t=>t.id===r.id);if(!found)created.push(r);else if(contentSignature(found)===contentSignature(r))existing.push(r);else different.push(r)})}state.importPreview={...parsed,created,existing,different};const mount=$('#importPreview');const errors=parsed.errors;mount.innerHTML=`<section class="panel settings-card" style="margin-top:18px"><div class="toolbar-title"><div><h2>Vista previa de la importación</h2><p>${errors.length?'Hay errores que debes corregir antes de continuar.':'Revisa el resumen antes de importar.'}</p></div></div>${errors.length?`<div class="import-results">${errors.map(e=>`<div class="import-result error">${icon('alert')} ${escapeHtml(e)}</div>`).join('')}</div>`:`<div class="import-meta"><div class="import-stat"><span>Registros leídos</span><strong>${parsed.total}</strong></div><div class="import-stat"><span>Nuevas tareas</span><strong>${created.length}</strong></div><div class="import-stat"><span>Ya existentes</span><strong>${existing.length+different.length}</strong></div><div class="import-stat"><span>Abiertas</span><strong>${parsed.records.filter(t=>!t.completed).length}</strong></div><div class="import-stat"><span>Hechas</span><strong>${parsed.records.filter(t=>t.completed).length}</strong></div><div class="import-stat"><span>Con fecha límite</span><strong>${parsed.records.filter(t=>t.dueDate).length}</strong></div></div>${different.length?`<div class="import-result warning">${different.length} identificador(es) ya existen con contenido diferente. Se omitirán; no se sobrescribirán.</div>`:''}${existing.length?`<div class="import-result">${existing.length} tarea(s) ya existen con el mismo contenido; no se duplicarán.</div>`:''}${parsed.warnings.length?`<div class="import-results">${parsed.warnings.map(w=>`<div class="import-result warning">${escapeHtml(w)}</div>`).join('')}</div>`:''}<div class="page-actions" style="justify-content:flex-start;margin-top:15px"><button class="btn btn-primary" data-action="commit-import" ${created.length===0?'disabled':''}>${icon('file-up')}Importar ${created.length} tareas</button><span class="field-help">La importación es todo o nada; las advertencias no detienen el lote.</span></div>`}</section>`;paintIcons(mount);mount.scrollIntoView({behavior:'smooth',block:'nearest'})}
function commitImport(){const p=state.importPreview;if(!p||p.errors.length){toast('Corrige los errores antes de importar.','error');return}const batch=uuid(),snapshot=JSON.parse(JSON.stringify(tasks));storageSet(`pastel.brisa.backup.${batch}`,JSON.stringify(snapshot));const currentIds=new Set(tasks.map(t=>t.id));let created=0;for(const r of p.records){if(currentIds.has(r.id))continue;r.importBatchId=batch;tasks.push(r);currentIds.add(r.id);created++}saveTasks();state.lastImport=created?{batch,created,when:new Date().toLocaleString('es-CR')}:null;savePrefs();state.importPreview=null;render();toast(`Importación completada: ${created} tareas nuevas. ${p.existing.length+p.different.length} ya existían y se omitieron.`);if(created===0)storageRemove(`pastel.brisa.backup.${batch}`)}
function rollbackImport(){const info=state.lastImport;if(!info?.batch){toast('No hay un lote reciente para revertir.','error');return}showConfirm({title:'¿Revertir la última importación?',desc:'Se ocultarán únicamente las tareas creadas por ese lote. Las tareas anteriores y los cambios que hiciste después se conservarán.',confirm:'Revertir lote',cancel:'Conservar',danger:true,onConfirm:()=>{let reverted=0;tasks=tasks.map(t=>{if(t.importBatchId===info.batch&&!t.deletedAt){reverted++;return {...t,deletedAt:new Date().toISOString()}}return t});saveTasks();storageRemove(`pastel.brisa.backup.${info.batch}`);state.lastImport=null;savePrefs();render();toast(`Lote revertido: ${reverted} tareas ocultadas.`)}})}
function downloadJson(){const blob=new Blob([sampleJson()],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='brisa-ejemplo-importacion.json';document.body.append(a);a.click();a.remove();URL.revokeObjectURL(url)}
function handleAction(action,el){switch(action){case'new-today':openNewTask(today);break;case'new-date':state.focus=el.dataset.date;state.view='week';savePrefs();render();openNewTask(el.dataset.date);break;case'edit':closeModal();openEditTask(el.dataset.id);break;case'toggle':toggleTask(el.dataset.id);if(state.modal?.type==='search'){}break;case'today':state.focus=today;render();break;case'focus-prev':state.focus=addDays(state.focus,-1);render();break;case'focus-next':state.focus=addDays(state.focus,1);render();break;case'focus-day':state.focus=el.dataset.date;render();break;case'month-prev':state.month=addMonths(state.month,-1);render();break;case'month-next':state.month=addMonths(state.month,1);render();break;case'month-pick':state.focus=el.dataset.date;gotoView('week');break;case'goto-import':gotoView('import');break;case'preview-import':previewImport();break;case'commit-import':commitImport();break;case'sample-json':$('#importJson').value=sampleJson();$('#importFileName').textContent='Ejemplo cargado';toast('Ejemplo listo para validar.');break;case'download-sample':downloadJson();break;case'rollback-import':rollbackImport();break;case'save-timezone':{const zone=$('#timeZone').value;try{new Intl.DateTimeFormat('en-US',{timeZone:zone}).format(new Date());prefs.timeZone=zone;today=todayInZone(zone);state.focus=today;state.month=`${today.slice(0,7)}-01`;savePrefs();render();toast('Zona horaria guardada.')}catch{toast('Esa zona horaria no es válida.','error')}break}case'save-display':savePrefs();toast('Preferencias guardadas.');render();break;case'reset-demo':showConfirm({title:'¿Restablecer los datos de demostración?',desc:'Se reemplazarán las tareas de este navegador por el conjunto inicial de ejemplo. Esta acción no se puede deshacer.',confirm:'Restablecer demo',cancel:'Cancelar',danger:true,onConfirm:()=>{tasks=sampleTasks(today);saveTasks();state.lastImport=null;savePrefs();render();toast('Datos de demostración restaurados.')}});break}}
$('#mainContent').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b){e.preventDefault();handleAction(b.dataset.action,b)}const size=e.target.closest('[data-size]');if(size){prefs.textSize=size.dataset.size;$$('[data-size]').forEach(x=>x.setAttribute('aria-pressed',String(x===size)));document.documentElement.style.fontSize=({'normal':'16px','large':'18.4px','xlarge':'20.8px'}[prefs.textSize]);savePrefs()}const theme=e.target.closest('[data-theme-choice]');if(theme){prefs.theme=theme.dataset.themeChoice;document.documentElement.dataset.theme=prefs.theme;$$('[data-theme-choice]').forEach(x=>x.setAttribute('aria-pressed',String(x===theme)));$('#themeToggle').innerHTML=icon(prefs.theme==='dark'?'sun':'moon');savePrefs()}});
document.addEventListener('click',e=>{const nav=e.target.closest('[data-view]');if(nav&&!nav.closest('#mainContent')){gotoView(nav.dataset.view);return}const modalAction=e.target.closest('[data-modal-action]');if(modalAction)return;if(state.modal?.type==='search'){const action=e.target.closest('[data-action]');if(action){if(action.dataset.action==='toggle'){const id=action.dataset.id;const query=$('#searchInput')?.value||'';toggleTask(id);openSearch();$('#searchInput').value=query;renderSearchResults()}else if(action.dataset.action==='edit'){closeModal();openEditTask(action.dataset.id)}}}});
$('#openSearch').addEventListener('click',openSearch);$('#themeToggle').addEventListener('click',()=>{prefs.theme=(prefs.theme||'light')==='dark'?'light':'dark';document.documentElement.dataset.theme=prefs.theme;$('#themeToggle').innerHTML=icon(prefs.theme==='dark'?'sun':'moon');$('#themeToggle').setAttribute('aria-label',prefs.theme==='dark'?'Activar modo claro':'Activar modo oscuro');savePrefs()});$('#openSettingsTop').addEventListener('click',()=>gotoView('settings'));$('#profileMenu').addEventListener('click',()=>gotoView('settings'));function closeMobileNav(){state.mobileNav=false;$('#sidebar').removeAttribute('style');$('#drawerOverlay')?.remove()}$('#mobileMenu').addEventListener('click',()=>{state.mobileNav=!state.mobileNav;const side=$('#sidebar');if(state.mobileNav){side.style.display='flex';side.style.position='fixed';side.style.zIndex='75';side.style.top='65px';side.style.bottom='0';side.style.width='270px';side.style.boxShadow='var(--shadow)';side.style.overflowY='auto';side.style.left='0';const shade=document.createElement('button');shade.id='drawerOverlay';shade.setAttribute('aria-label','Cerrar navegación');shade.style.cssText='position:fixed;inset:65px 0 0;border:0;background:rgba(19,25,24,.45);z-index:70;';shade.addEventListener('click',closeMobileNav);document.body.append(shade)}else closeMobileNav()});
document.addEventListener('change',async e=>{if(e.target.id==='importFile'){const file=e.target.files?.[0];if(!file)return;try{const text=await file.text();$('#importJson').value=text;$('#importFileName').textContent=file.name;state.importFileName=file.name;toast('Archivo cargado. Valida su contenido antes de importar.')}catch{toast('No se pudo leer el archivo.','error')}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.modal?.type==='confirm'){const reopen=!!state.editor;closeModal();if(reopen)showEditor()}else if(state.editor)requestCloseEditor();else closeModal()}if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();openSearch()}});
const mq=matchMedia('(prefers-color-scheme: dark)');mq.addEventListener?.('change',e=>{if(!storageGet(PREFS)){prefs.theme=e.matches?'dark':'light';render()}});
today=todayInZone('America/Costa_Rica');load();today=todayInZone(prefs.timeZone||'America/Costa_Rica');state.focus=state.focus||today;document.documentElement.dataset.theme=prefs.theme||'light';paintIcons(document);render();
setInterval(()=>{const newToday=todayInZone(prefs.timeZone||'America/Costa_Rica');if(newToday!==today){today=newToday;render()}},30000);
})();
