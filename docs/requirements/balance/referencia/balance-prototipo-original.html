<meta name="color-scheme" content="light dark">
<script>
(() => {
  try {
    const saved = localStorage.getItem('pastel.balance.theme');
    const preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = saved === 'light' || saved === 'dark' ? saved : preferred;
  } catch { /* La vista local sigue funcionando sin almacenamiento. */ }
})();
</script>

  /* Componentes interactivos: estados estables y texto legible en todos los estados. */
  :root {
    --accent-hover: color-mix(in srgb, var(--accent-strong) 86%, var(--text) 14%);
    --accent-pressed: color-mix(in srgb, var(--accent-strong) 76%, var(--text) 24%);
    --danger-hover: color-mix(in srgb, var(--danger) 86%, var(--text) 14%);
    --soft-hover: color-mix(in srgb, var(--accent-soft) 72%, var(--surface) 28%);
  }
  :root[data-theme="dark"] {
    --accent-hover: color-mix(in srgb, var(--accent-strong) 88%, var(--text) 12%);
    --accent-pressed: color-mix(in srgb, var(--accent-strong) 80%, var(--text) 20%);
    --danger-hover: color-mix(in srgb, var(--danger) 88%, var(--text) 12%);
    --soft-hover: color-mix(in srgb, var(--accent-soft) 65%, var(--surface) 35%);
  }
  .btn {
    min-height: 44px;
    border-radius: 10px;
    transition: box-shadow .12s ease, transform .12s ease;
  }
  .btn:hover { background: var(--app-bg); color: var(--text); border-color: var(--border-strong); }
  .btn-primary, .btn-primary:hover, .btn-primary:focus-visible {
    background: var(--accent-strong);
    border-color: var(--accent-strong);
    color: var(--on-accent);
    filter: none;
  }
  .btn-primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    color: var(--on-accent);
    box-shadow: 0 2px 0 color-mix(in srgb, var(--text) 9%, transparent);
    transform: translateY(-1px);
  }
  .btn-primary:active {
    background: var(--accent-pressed);
    border-color: var(--accent-pressed);
    color: var(--on-accent);
    box-shadow: none;
    transform: translateY(0);
  }
  .btn-soft, .btn-soft:hover {
    color: var(--accent-strong);
    background: var(--accent-soft);
  }
  .btn-soft:hover { background: var(--soft-hover); border-color: var(--border); }
  .btn-danger, .btn-danger:hover, .btn-danger:focus-visible {
    background: var(--danger);
    border-color: var(--danger);
    color: var(--on-accent);
    filter: none;
  }
  .btn-danger:hover { background: var(--danger-hover); border-color: var(--danger-hover); }
  .btn-danger:active { filter: none; transform: translateY(1px); }
  .btn-quiet { color: var(--text-secondary); background: transparent; }
  .btn-quiet:hover { color: var(--text); background: var(--app-bg); border-color: var(--border); }
  .btn:disabled, .btn:disabled:hover, .icon-button:disabled, .icon-button:disabled:hover {
    opacity: 1;
    color: var(--text-secondary);
    background: var(--app-bg);
    border-color: var(--border);
    box-shadow: none;
    filter: none;
    transform: none;
    cursor: not-allowed;
  }
  .btn-primary:disabled, .btn-primary:disabled:hover, .btn-danger:disabled, .btn-danger:disabled:hover {
    color: var(--text-secondary);
    background: var(--border);
    border-color: var(--border);
  }
  .icon-button, .avatar-button {
    transition: none;
  }
  .icon-button:hover { background: var(--accent-soft); border-color: var(--border); color: var(--accent-strong); }
  .avatar-button:hover { background: var(--surface); border-color: var(--border-strong); color: var(--text); }
  .nav-item:hover:not(.active) { background: var(--surface); color: var(--text); }
  .tab:hover:not(.active) { background: var(--app-bg); color: var(--text); }
  .small-link {
    display: inline-flex;
    min-height: 36px;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 6px 9px;
    border-radius: 8px;
    color: var(--accent-strong);
    transition: none;
  }
  .small-link:hover { background: var(--accent-soft); color: var(--accent-strong); text-decoration: underline; text-underline-offset: 3px; }
  .group-card-description { color: var(--text-secondary); font-size: .875rem; line-height: 1.5; }
  .group-total { display: grid; gap: 2px; margin-top: 15px; }
  .group-total span { color: var(--muted); font-size: .75rem; font-weight: 650; }
  .group-total strong { color: var(--text); font-size: 1.45rem; letter-spacing: -.035em; line-height: 1.25; font-weight: 760; font-variant-numeric: tabular-nums; }
  .group-amount-label { margin-top: 3px; }
  .groups-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 4px 0 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .groups-summary { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; color: var(--muted); font-size: .875rem; }
  .groups-summary strong { color: var(--text); font-weight: 700; }
  .summary-separator { color: var(--border-strong); }
  .group-controls { display: flex; align-items: center; justify-content: flex-end; gap: 12px; min-width: 0; }
  .group-filter-group { display: inline-flex; align-items: center; gap: 3px; padding: 3px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  .filter-chip { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 0 10px; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--text-secondary); font-size: .8125rem; font-weight: 650; white-space: nowrap; transition: background-color .16s ease, color .16s ease, border-color .16s ease; }
  .filter-chip span { display: inline-grid; min-width: 20px; height: 20px; place-items: center; padding: 0 5px; border-radius: 999px; background: var(--app-bg); color: var(--text-secondary); font-size: .75rem; font-variant-numeric: tabular-nums; }
  .filter-chip:hover:not(.active) { background: var(--app-bg); color: var(--text); }
  .filter-chip.active, .filter-chip.active:hover { color: var(--accent-strong); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 12%, transparent); }
  .filter-chip.active span { color: var(--accent-strong); background: var(--surface); }
  .group-controls .searchbox { width: 230px; min-width: 190px; max-width: 270px; flex: 0 1 270px; }
  .group-card:hover { border-color: color-mix(in srgb, var(--accent-strong) 28%, var(--border)); box-shadow: 0 5px 16px rgba(38,49,58,.045); }
  .group-card:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent-strong) 45%, transparent); outline-offset: 3px; }
  .empty-note strong { color: var(--text); display: block; margin-bottom: 5px; }
  .empty-note p { color: var(--text-secondary); margin: 0 0 12px; }
  @media (hover: none) {

  }

  /* Mantener contraste completo durante hover: el color de texto no se anima. */
  .btn, .icon-button, .avatar-button, .small-link, .filter-chip { transition: none; }
  .group-card-description { min-height: 3em; }

    if(intent.kind==='stay'){state.expenseManagementDraft=null;state.expenseManagementDirty=false;state.expenseManagementErrors=null;render();return;}
    if(intent.kind==='tab'){switchGroupTab(intent.value);return;}
    if(intent.kind==='nav'){
      if(intent.value==='groups'){state.page='groups';state.filter='';render();scrollPageToTop();}
      else if(intent.value==='help'){state.page='help';render();scrollPageToTop();}
      else if(intent.value==='profile'){state.page='profile';render();scrollPageToTop();}
      return;
    }
    if(intent.kind==='group'){state.expenseManagementDraft=null;state.expenseManagementDirty=false;openGroup(intent.id);return;}
    if(intent.kind==='action'){
      const a=intent.action;

      else if(a==='tab-expenses')switchGroupTab('expenses');

  function switchGroupTab(value,focus=false){
    const g=byId(state.groupId);if(!g)return;
    if((value==='settings'||value==='expense-management')&&!isAdmin(g)){toast('Solo una persona administradora puede acceder a esta pestaña.','error');return;}
    if(value===state.tab)return;
    if(value==='expense-management')beginExpenseManagement(g);
    else if(state.tab==='expense-management'){state.expenseManagementDraft=null;state.expenseManagementDirty=false;state.expenseManagementErrors=null;}
    state.tab=value;state.filter='';render();
    if(focus)document.getElementById(`group-tab-${value}`)?.focus();
    else document.getElementById('groupTabPanel')?.focus({preventScroll:true});
  }
  window.addEventListener('beforeunload',e=>{if(expenseManagementIsDirty()){e.preventDefault();e.returnValue='';}});

  function renderExpenses(g){
    const q=(state.filter||'').trim().toLowerCase();let list=sortedExpenses(g).filter(e=>!q||e.description.toLowerCase().includes(q)||memberName(g,e.payer).toLowerCase().includes(q));
    if(state.expenseFilter==='mine')list=list.filter(e=>e.payer===me);
    if(state.expenseFilter==='others')list=list.filter(e=>e.payer!==me);
    const byAmount=(a,b)=>b.units-a.units||b.date.localeCompare(a.date)||b.id-a.id;
    if(state.expenseSort==='amount-desc')list.sort(byAmount);
    else if(state.expenseSort==='amount-asc')list.sort((a,b)=>a.units-b.units||b.date.localeCompare(a.date)||a.id-b.id);
    else if(state.expenseSort==='date-asc')list.sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
    else if(state.expenseSort==='alpha-asc')list.sort((a,b)=>a.description.localeCompare(b.description,'es',{sensitivity:'base'})||b.date.localeCompare(a.date));
    else if(state.expenseSort==='alpha-desc')list.sort((a,b)=>b.description.localeCompare(a.description,'es',{sensitivity:'base'})||b.date.localeCompare(a.date));
    else list.sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
    const visibleTotal = list.reduce((sum, expense) => sum + expense.units, 0);
    return `<div class="panel expenses-panel"><div class="panel-header expenses-panel-header"><div><h2>Gastos del grupo</h2><p>Busque, filtre y ordene los movimientos. Cada fila indica quién pagó y cuándo.</p></div>${btn('Registrar gasto','new-expense',g.status==='open'?'btn-primary':'btn','plus',g.status==='closed'?'disabled':'')}</div><div class="filter-bar expense-controls"><label class="searchbox">${icon('search')}<input id="expenseSearch" placeholder="Buscar descripción o persona" aria-label="Buscar gasto" value="${esc(state.filter)}"></label><label class="select-control"><span>Mostrar</span><select id="expenseFilter" aria-label="Filtrar gastos"><option value="all" ${state.expenseFilter==='all'?'selected':''}>Todos</option><option value="mine" ${state.expenseFilter==='mine'?'selected':''}>Pagados por mí</option><option value="others" ${state.expenseFilter==='others'?'selected':''}>Pagados por otras personas</option></select></label><label class="select-control sort-control"><span>Ordenar por</span><select id="expenseSort" aria-label="Ordenar gastos"><option value="date-desc" ${state.expenseSort==='date-desc'?'selected':''}>Fecha del gasto: más reciente</option><option value="date-asc" ${state.expenseSort==='date-asc'?'selected':''}>Fecha del gasto: más antigua</option><option value="amount-desc" ${state.expenseSort==='amount-desc'?'selected':''}>Mayor importe</option><option value="amount-asc" ${state.expenseSort==='amount-asc'?'selected':''}>Menor importe</option><option value="alpha-asc" ${state.expenseSort==='alpha-asc'?'selected':''}>Alfabético: A–Z</option><option value="alpha-desc" ${state.expenseSort==='alpha-desc'?'selected':''}>Alfabético: Z–A</option></select></label></div><div class="expenses-total-strip" role="status" aria-live="polite"><div><strong>Total de resultados</strong><span>${list.length} de ${g.expenses.length} ${g.expenses.length===1?'gasto':'gastos'}</span></div><strong>${moneyUnits(visibleTotal,g.currency)}</strong></div><div class="expense-list all-expenses-list">${list.map(e=>expenseRow(g,e,true,true)).join('')||'<div class="no-results">No se encontraron gastos con esos filtros. Cambie la búsqueda o seleccione «Todos».</div>'}</div></div>`;
  }
  function renderBalances(g,s){
    const positive=s.balances.filter(b=>b.balance>0).reduce((a,b)=>a+b.balance,0),negative=s.balances.filter(b=>b.balance<0).reduce((a,b)=>a-b.balance,0),max=Math.max(1,...s.balances.map(b=>Math.abs(b.balance)));
    const paidTotal=s.balances.reduce((a,b)=>a+b.paid,0),shareTotal=s.balances.reduce((a,b)=>a+b.share,0),balanceTotal=s.balances.reduce((a,b)=>a+b.balance,0);
    return `<div class="balance-total-strip"><div class="balance-total"><span>Total de gastos</span><strong>${moneyUnits(s.total,g.currency)}</strong></div><div class="balance-total"><span>Por recibir</span><strong class="amount-positive">${moneyUnits(positive,g.currency)}</strong></div><div class="balance-total"><span>Por pagar</span><strong class="amount-negative">${moneyUnits(negative,g.currency)}</strong></div></div><section class="panel"><div class="panel-header"><div><h2>Saldos por participante</h2><p>El saldo es lo que pagó menos su parte del total. El resultado suma exactamente cero.</p></div><span class="status-chip">${g.members.length} personas</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Participante</th><th>Total pagado</th><th>Parte asignada</th><th class="right">Saldo</th></tr></thead><tbody>${s.balances.map(b=>`<tr><td><div class="person-cell">${avatarHTML(b,b.position)}<div class="table-person-summary"><strong>${esc(b.name)}${b.id===me?' (usted)':''}</strong><div class="status-text">${esc(b.role)}</div></div></div></td><td>${moneyUnits(b.paid,g.currency)}</td><td>${moneyUnits(b.share,g.currency)}</td><td class="right"><strong class="${b.balance>0?'amount-positive':b.balance<0?'amount-negative':''}">${b.balance>0?'+':b.balance<0?'−':''}${moneyUnits(Math.abs(b.balance),g.currency)}</strong><div class="balance-bar" aria-label="Magnitud relativa del saldo"><span style="width:${Math.max(4,Math.abs(b.balance)/max*100)}%;background:${b.balance>0?'var(--success)':b.balance<0?'var(--danger)':'var(--muted)'}"></span></div></td></tr>`).join('')}</tbody><tfoot><tr class="totals-row"><th scope="row">Totales</th><td><span class="mobile-total-label">Total pagado</span><strong>${moneyUnits(paidTotal,g.currency)}</strong></td><td><span class="mobile-total-label">Parte asignada</span><strong>${moneyUnits(shareTotal,g.currency)}</strong></td><td class="right"><span class="mobile-total-label">Saldo neto</span><strong class="${balanceTotal===0?'':balanceTotal>0?'amount-positive':'amount-negative'}">${balanceTotal>0?'+':balanceTotal<0?'−':''}${moneyUnits(Math.abs(balanceTotal),g.currency)}</strong><span class="totals-note">${balanceTotal===0?'Cuadra': 'Revisar diferencia'}</span></td></tr></tfoot></table></div><div class="callout" style="margin-top:16px">${icon('info')}<span>Las unidades mínimas sobrantes se asignan por orden de ingreso al grupo. El total pagado y la parte asignada deben coincidir; la suma de saldos debe ser cero.</span></div><div class="panel-footer">${btn('Ver transferencias sugeridas','tab-settlement','btn-primary','arrow')}</div></section>`;
  }
  function renderSettlement(g,s){
    const incomingTotal=s.transfers.reduce((n,t)=>n+t.units,0);
    return `<section class="panel settlement-main-panel"><div class="settlement-summary"><div><h2>${g.status==='closed'?'Liquidación (grupo cerrado)':'Liquidación sugerida'}</h2><p>${s.transfers.length?`Con ${s.transfers.length} ${s.transfers.length===1?'transferencia':'transferencias'} se pueden equilibrar todos los saldos.`:'Los gastos actuales ya están equilibrados.'} Son propuestas; no representan pagos realizados.</p></div><div class="settlement-summary-total"><strong>${s.transfers.length}</strong><span>${s.transfers.length===1?'transferencia':'transferencias'}</span></div></div><div class="settlement-layout"><section class="settlement-transfers-panel"><div class="panel-header"><div><h3>Transferencias sugeridas</h3><p>Quién transfiere, a quién y cuánto.</p></div></div>${s.transfers.length?`<div class="transfer-list compact-transfer-list">${s.transfers.map(t=>`<div class="transfer-card compact-transfer-card"><div class="transfer-person"><span class="avatar">${esc(memberName(g,t.from).split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase())}</span><div><strong>${esc(memberName(g,t.from))}</strong><small>Transfiere</small></div></div><span class="transfer-middle compact-transfer-middle">${icon('arrow')}</span><div class="transfer-person transfer-recipient"><span class="avatar">${esc(memberName(g,t.to).split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase())}</span><div><strong>${esc(memberName(g,t.to))}</strong><small>Recibe</small></div></div><strong class="compact-transfer-amount">${moneyUnits(t.units,g.currency)}</strong></div>`).join('')}</div><div class="settlement-sumline"><span>Total transferido en la propuesta</span><strong>${moneyUnits(incomingTotal,g.currency)}</strong></div>`:`<div class="empty-note">No hay transferencias pendientes. Los saldos actuales están equilibrados.</div>`}</section><aside class="settlement-explanation-panel"><div class="panel-header"><div><h3>Por qué queda saldado</h3><p>Comprobación persona por persona.</p></div></div><div class="settlement-explanation-list">${s.balances.map(b=>settlementExplanation(g,s,b)).join('')}</div><div class="settlement-explanation-foot">La suma que se propone aportar coincide con la suma que se propone recibir. Nadie aparece como pagado: son instrucciones sugeridas.</div></aside></div><div class="callout settlement-note">${icon('info')}<span>Balance <strong>no marca transferencias como pagadas</strong> ni guarda movimientos bancarios. Si cambian los gastos o las personas participantes, esta sugerencia se recalcula.</span></div></section>`;
  }

  function settlementExplanation(g,s,b){
    const incoming=s.transfers.filter(t=>t.to===b.id),outgoing=s.transfers.filter(t=>t.from===b.id);
    const person=`<span class="settlement-explain-person">${avatarHTML(b,b.position)}<span class="settlement-explain-label"><strong>${esc(b.name)}</strong><small>${b.balance>0?'Por recibir':b.balance<0?'Por aportar':'Al día'}</small></span></span>`;
    if(b.balance>0){
      const proposed=incoming.reduce((n,t)=>n+t.units,0);
      return `<details class="settlement-explain-card settlement-explain-compact"><summary class="settlement-explain-summary">${person}<span class="settlement-explain-value"><strong class="amount-positive">${moneyUnits(b.balance,g.currency)}</strong><span class="explain-check ${proposed===b.balance?'':'warning'}">${proposed===b.balance?'Cubierto':'Revisar'}</span>${icon('chevron')}</span></summary><div class="settlement-explain-body"><p>Pagó ${moneyUnits(b.paid,g.currency) } y su parte era ${moneyUnits(b.share,g.currency)}. Debe recibir <strong class="amount-positive">${moneyUnits(b.balance,g.currency)}</strong>.</p><div class="explain-transfer-list">${incoming.map(t=>`<div><span>${esc(memberName(g,t.from))} le transferiría</span><strong>${moneyUnits(t.units,g.currency)}</strong></div>`).join('')||'<div><span>No hay transferencias propuestas.</span><strong>—</strong></div>'}</div><div class="explain-total"><span>Total que recibiría</span><strong>${moneyUnits(proposed,g.currency)}</strong><span class="explain-check ${proposed===b.balance?'':'warning'}">${proposed===b.balance?'Saldo cubierto':'Revisar diferencia'}</span></div></div></details>`;
    }
    if(b.balance<0){
      const proposed=outgoing.reduce((n,t)=>n+t.units,0);
      return `<details class="settlement-explain-card settlement-explain-compact"><summary class="settlement-explain-summary">${person}<span class="settlement-explain-value"><strong class="amount-negative">${moneyUnits(-b.balance,g.currency)}</strong><span class="explain-check ${proposed===-b.balance?'':'warning'}">${proposed===-b.balance?'Cubierto':'Revisar'}</span>${icon('chevron')}</span></summary><div class="settlement-explain-body"><p>Pagó ${moneyUnits(b.paid,g.currency)} y su parte era ${moneyUnits(b.share,g.currency)}. Le falta aportar <strong class="amount-negative">${moneyUnits(-b.balance,g.currency)}</strong>.</p><div class="explain-transfer-list">${outgoing.map(t=>`<div><span>Transferiría a ${esc(memberName(g,t.to))}</span><strong>${moneyUnits(t.units,g.currency)}</strong></div>`).join('')||'<div><span>No hay transferencias propuestas.</span><strong>—</strong></div>'}</div><div class="explain-total"><span>Total que aportaría</span><strong>${moneyUnits(proposed,g.currency)}</strong><span class="explain-check ${proposed===-b.balance?'':'warning'}">${proposed===-b.balance?'Saldo cubierto':'Revisar diferencia'}</span></div></div></details>`;
    }
    return `<details class="settlement-explain-card settlement-explain-compact settled"><summary class="settlement-explain-summary">${person}<span class="settlement-explain-value"><strong>${moneyUnits(0,g.currency)}</strong><span class="explain-check">Sin diferencia</span>${icon('chevron')}</span></summary><div class="settlement-explain-body"><p>Pagó exactamente su parte asignada. No necesita transferir ni recibir dinero.</p><div class="explain-total"><span>Saldo final</span><strong>${moneyUnits(0,g.currency)}</strong><span class="explain-check">Sin diferencia</span></div></div></details>`;
  }

  function renderMembers(g,admin){
    const cards=g.members.map((m,i)=>`<article class="member-card member-card-compact">${avatarHTML(m,i)}<div class="member-info"><strong>${esc(m.name)}${m.id===me?' (usted)':''}</strong><small>${m.id===me?'Su cuenta de Pastel':m.id===g.members[0]?.id?'Se unió primero':'Participante del grupo'}</small></div><span class="role-chip">${esc(m.role)}</span>${admin&&m.id!==me?`<button class="icon-button member-role-button" data-action="member-role" data-id="${esc(m.id)}" title="Cambiar rol de ${esc(m.name)}" aria-label="Cambiar rol de ${esc(m.name)}">${icon('settings')}</button>`:''}</article>`).join('');

  }
  function inviteCard(g){return `<section class="invite-card"><div class="invite-heading">${icon('link')}<span>Enlace para invitar</span><span class="role-chip" style="margin-left:auto">Solo administradores</span></div><p>Comparta el enlace y el código por el medio que prefiera. Quien se una necesita iniciar sesión con su cuenta de Pastel.</p><div class="field invite-link-field"><span>pastel.local/balance/ingresar#${esc(g.inviteToken)}</span><button class="icon-button" data-action="copy-link" title="Copiar enlace" aria-label="Copiar enlace">${icon('copy')}</button></div><div class="invite-code" aria-label="Código de demostración">${esc(g.inviteCode)}</div><div class="invite-actions">${btn('Copiar enlace y código','copy-invite','btn-primary','copy')}${btn('Generar nuevo código','regenerate-invite','btn-small','refresh')}</div><p class="hint invite-security-note">Al generar un nuevo enlace, el anterior deja de funcionar. El código real debe limitar intentos y no guardarse en registros del sistema.</p></section>`;}
  function renderSettings(g){
    if(!isAdmin(g)){state.tab='overview';return renderGroup();}
    return `<div class="grid settings-grid"><section class="panel settings-data-panel"><div class="panel-header"><div><h2>Datos del grupo</h2><p>Edite el nombre, la moneda o la zona horaria.</p></div>${icon('settings')}</div><form id="groupSettingsForm" class="form-stack"><div class="form-field"><label for="settingsName">Nombre del grupo</label><input id="settingsName" class="field" maxlength="120" required value="${esc(g.name)}"><small>El nombre puede tener hasta 120 caracteres.</small><div class="error">Ingrese un nombre para el grupo.</div></div><div class="form-field"><label for="settingsDescription">Descripción <span class="text-muted">(opcional)</span></label><textarea id="settingsDescription" rows="3" maxlength="500">${esc(g.description)}</textarea><small>Una breve explicación ayuda a reconocer el propósito del grupo.</small></div><div class="field-row"><div class="form-field"><label for="settingsCurrency">Moneda del grupo</label><select id="settingsCurrency" class="field">${currencyOptions(g.currency)}</select><small>La moneda es común a todos los gastos.</small></div><div class="form-field"><label for="settingsTimezone">Zona horaria</label><select id="settingsTimezone" class="field"><option value="America/Costa_Rica" ${g.timezone==='America/Costa_Rica'?'selected':''}>Costa Rica (UTC−6)</option><option value="America/Mexico_City" ${g.timezone==='America/Mexico_City'?'selected':''}>Ciudad de México</option><option value="America/Bogota" ${g.timezone==='America/Bogota'?'selected':''}>Bogotá</option><option value="America/New_York" ${g.timezone==='America/New_York'?'selected':''}>Nueva York</option><option value="Europe/Madrid" ${g.timezone==='Europe/Madrid'?'selected':''}>Madrid</option><option value="Asia/Tokyo" ${g.timezone==='Asia/Tokyo'?'selected':''}>Tokio</option></select><small>La fecha de cada gasto se mantiene como fecha de calendario.</small></div></div><div class="callout">${icon('info')}<span><strong>Corrección de moneda, sin conversión.</strong> Al cambiar de moneda, los importes numéricos permanecen iguales. Si la nueva moneda no admite los decimales de algún gasto, se rechaza el cambio completo.</span></div><div style="display:flex;justify-content:flex-end">${btn('Guardar cambios','save-group-settings','btn-primary','check')}</div></form></section><div class="grid" style="gap:18px"><section class="panel"><h2 style="font-size:1.05rem;margin:0 0 8px">Ciclo de vida</h2><div class="settings-item"><span class="stat-icon">${icon(g.status==='open'?'lock':'refresh')}</span><div class="settings-copy"><strong>${g.status==='open'?'Cerrar grupo':'Reabrir grupo'}</strong><p>${g.status==='open'?'El grupo queda en solo lectura, pero los saldos siguen disponibles.':'Vuelven a permitirse los cambios y el registro de gastos.'}</p></div>${btn(g.status==='open'?'Cerrar':'Reabrir','toggle-group-status','btn-small')}</div><p class="hint">Esta acción queda registrada en la auditoría. Puede revertirse al reabrir el grupo.</p></section><section class="danger-zone"><h3>Zona de cuidado</h3><p>Solo se puede eliminar un grupo cuando no tiene gastos registrados. La eliminación también quita participantes, enlace y código de ingreso.</p>${btn('Eliminar grupo','delete-group','btn-danger','trash',g.expenses.length?'disabled title="Primero debe eliminar todos los gastos"':'')} ${g.expenses.length?`<p class="hint">Este grupo tiene ${g.expenses.length} gastos. Elimine los gastos primero para habilitar esta acción.</p>`:''}</section><section class="panel"><h2 style="font-size:1.05rem;margin:0 0 8px">Administración</h2><p class="hint">Debe permanecer al menos una persona administradora. Los miembros solo pueden editar sus propios gastos; el equipo administrador puede gestionar todo el grupo.</p><button class="small-link" data-tab="members">Ver participantes y roles ${icon('arrow')}</button></section></div></div>`;
  }
  function currencyOptions(selected){return Object.keys(currencyInfo).sort((a,b)=>{const order=['CRC','USD','EUR','MXN','COP','ARS','CLP','UYU','DOP','CUP','PHP','JPY','CNY','KRW','PEN','BRL','GTQ','HNL','NIO','PAB','PYG','BOB','VES','CAD','GBP','CHF','SEK','NOK','DKK','PLN','AUD','NZD','SGD','HKD','INR','THB','TRY','ZAR','AED','ILS'];return (order.indexOf(a)<0?999:order.indexOf(a))-(order.indexOf(b)<0?999:order.indexOf(b));}).map(c=>`<option value="${c}" ${c===selected?'selected':''}>${c} · ${esc(currencyInfo[c].name)} (${esc(currencyInfo[c].symbol)})${currencyInfo[c].decimals===0?' · sin decimales':''}</option>`).join('');}
  function renderHelp(){return `<div class="page-head"><div><div class="eyebrow">Ayuda</div><h1>¿Cómo funciona Balance?</h1><p>Gastos compartidos, cuentas claras y una propuesta sencilla para saldar diferencias.</p></div></div><div class="grid member-grid"><section class="panel"><span class="stat-icon">${icon('users')}</span><h2 style="font-size:1.08rem">1. Cree un grupo</h2><p class="hint">Seleccione una moneda y una zona horaria. Quien crea el grupo empieza como administrador. Todos los participantes necesitan una cuenta de Pastel.</p></section><section class="panel"><span class="stat-icon">${icon('receipt')}</span><h2 style="font-size:1.08rem">2. Registre los gastos</h2><p class="hint">Anote qué se compró, cuánto costó, quién pagó y en qué fecha. Puede corregir o eliminar sus propios gastos; una persona administradora puede gestionar cualquiera.</p></section><section class="panel"><span class="stat-icon">${icon('scale')}</span><h2 style="font-size:1.08rem">3. Revise los saldos</h2><p class="hint">Cada gasto se divide entre todas las personas del grupo. Si alguien se incorpora después, también participa en el reparto de los gastos anteriores.</p></section><section class="panel"><span class="stat-icon">${icon('arrow')}</span><h2 style="font-size:1.08rem">4. Consulte la liquidación</h2><p class="hint">Balance sugiere transferencias para equilibrar los saldos. No envía dinero ni marca las transferencias como pagadas.</p></section></div><section class="panel" style="margin-top:18px"><h2 style="font-size:1.05rem;margin:0 0 12px">Principios importantes</h2><div class="settings-item"><span class="stat-icon">${icon('check')}</span><div class="settings-copy"><strong>La suma siempre coincide</strong><p>Las diferencias de una unidad mínima se reparten por orden de ingreso.</p></div></div><div class="settings-item"><span class="stat-icon">${icon('lock')}</span><div class="settings-copy"><strong>Sus grupos son privados</strong><p>Solo las personas del grupo pueden consultar sus datos; se requiere una sesión de Pastel.</p></div></div><div class="settings-item"><span class="stat-icon">${icon('calendar')}</span><div class="settings-copy"><strong>Cerrar no elimina</strong><p>Un grupo cerrado queda en solo lectura y puede reabrirse por una persona administradora.</p></div></div></section>${btn('Volver a mis grupos','back-groups','btn-primary','left')}`;}
  function renderProfile(){return `<div class="page-head"><div><div class="eyebrow">Cuenta de demostración</div><h1>Leandro Mora</h1><p>Vista ilustrativa del menú de cuenta de Pastel.</p></div></div><section class="panel" style="max-width:640px"><div class="member-card" style="border:0;padding:0 0 17px;border-bottom:1px solid var(--border);border-radius:0">${avatarHTML({name:'Leandro Mora',initials:'LM',id:'leo'},0)}<div class="member-info"><strong>Leandro Mora</strong><small>leandro@example.com · Cuenta de ejemplo</small></div><span class="role-chip">Sesión simulada</span></div><div class="settings-item"><span class="stat-icon">${icon('sun')}</span><div class="settings-copy"><strong>Apariencia</strong><p>Seleccione tema claro u oscuro desde el encabezado.</p></div><button class="btn btn-small" id="profileTheme">Cambiar tema</button></div><div class="settings-item"><span class="stat-icon">${icon('logout')}</span><div class="settings-copy"><strong>Sesión</strong><p>Este archivo no inicia ni cierra una sesión real.</p></div></div></section>${btn('Volver a mis grupos','back-groups','btn-primary','left')}`;}
  function openModal(type,data={}){
    state.modalType=type;state.previousFocus=document.activeElement;
    const modal=$('#modal'),g=byId(state.groupId);
    let title='',desc='',body='',submitLabel='Guardar';
    if(type==='expense-management-unsaved'){
      title='Hay cambios sin guardar';desc='Si sale de la gestión integral de gastos, perderá las modificaciones que todavía no ha guardado.';submitLabel='Descartar y salir';
      body=`<div class="callout management-confirm-callout">${icon('info')}<span>Los cambios de la tabla todavía no se han aplicado al grupo. Puede guardarlos antes de continuar o descartarlos y recuperar los datos anteriores.</span></div>`;
    }else if(type==='new-group'){
      title='Crear un grupo';desc='Defina el grupo, su moneda y la zona horaria.';submitLabel='Crear grupo';
      body=`<form id="newGroupForm" class="form-stack"><div class="form-field" id="newNameField"><label for="newGroupName">Nombre del grupo</label><input class="field" id="newGroupName" maxlength="120" required placeholder="Ej. Viaje a la playa"><div class="error">Ingrese un nombre para el grupo.</div></div><div class="form-field"><label for="newGroupDescription">Descripción <span class="text-muted">(opcional)</span></label><textarea id="newGroupDescription" rows="3" maxlength="500" placeholder="¿Para qué se utilizará este grupo?"></textarea></div><div class="form-field"><label for="newGroupCurrency">Moneda</label><select class="field" id="newGroupCurrency" required>${currencyOptions('CRC')}</select><small>Todos los gastos del grupo se registran en esta moneda.</small></div><div class="form-field"><label for="newGroupTimezone">Zona horaria</label><select class="field" id="newGroupTimezone"><option value="America/Costa_Rica">Costa Rica (UTC−6)</option><option value="America/Mexico_City">Ciudad de México</option><option value="America/Bogota">Bogotá</option><option value="America/New_York">Nueva York</option><option value="Europe/Madrid">Madrid</option><option value="Asia/Tokyo">Tokio</option></select><small>Por defecto: America/Costa_Rica.</small></div></form>`;
    }else if(type==='expense'){
      const editing=data.expense?g.expenses.find(e=>e.id===Number(data.expense)):null;
      title=editing?'Editar gasto':'Registrar un gasto';desc=editing?'Actualice el importe, la persona que pagó o la fecha.':'Anote los detalles del gasto compartido.';submitLabel=editing?'Guardar cambios':'Guardar gasto';
      const permittedPayers=g.members.filter(m=>isAdmin(g)||m.id===me);
      body=`<form id="expenseForm" class="form-stack" data-expense-id="${editing?.id||''}"><div class="form-field" id="expenseDescriptionField"><label for="expenseDescription">¿En qué se gastó?</label><input class="field" id="expenseDescription" required maxlength="200" value="${esc(editing?.description||'')}" placeholder="Ej. Compra del supermercado"><div class="error">Escriba una descripción para identificar el gasto.</div></div><div class="form-field" id="expenseAmountField"><label for="expenseAmount">Monto (${esc(g.currency)})</label><input class="field" id="expenseAmount" inputmode="${currencyInfo[g.currency].decimals===0?'numeric':'decimal'}" autocomplete="off" required value="${editing?esc(fromUnits(editing.units,g.currency)):''}" placeholder="${currencyInfo[g.currency].decimals===0?'1500':'1250,50'}"><small>Acepte coma o punto decimal. ${currencyInfo[g.currency].decimals===0?'Esta moneda no utiliza decimales.':`Máximo ${currencyInfo[g.currency].decimals} decimales.`}</small><div class="error" id="expenseAmountError">Ingrese un monto válido.</div></div><div class="form-field"><label for="expensePayer">¿Quién pagó?</label><select id="expensePayer" class="field" ${!isAdmin(g)&&editing?'disabled':''}>${permittedPayers.map(m=>`<option value="${esc(m.id)}" ${m.id===(editing?.payer||me)?'selected':''}>${esc(m.name)}${m.id===me?' (usted)':''}</option>`).join('')}</select>${!isAdmin(g)?'<small>Como miembro, solo puede registrar gastos pagados por usted.</small>':''}</div><div class="form-field" id="expenseDateField"><label for="expenseDate">Fecha del gasto</label><input class="field" id="expenseDate" type="date" required value="${esc(editing?.date||today)}"><small>La fecha corresponde al calendario de este grupo.</small><div class="error">Seleccione una fecha válida.</div></div></form>`;
    }else if(type==='delete-expense'){
      const e=g.expenses.find(x=>x.id===Number(data.id));if(!e)return;
      title='Eliminar gasto';desc='Esta acción modifica nuevamente los saldos del grupo.';submitLabel='Eliminar gasto';
      body=`<p>¿Desea eliminar <strong>${esc(e.description)}</strong> por <strong>${moneyUnits(e.units,g.currency)}</strong>?</p><p class="hint">El movimiento se quitará de la lista y Balance recalculará todas las partes y transferencias sugeridas.</p>`;
    }else if(type==='regenerate'){
      title='Generar un nuevo enlace';desc='El enlace y el código anteriores dejarán de funcionar.';submitLabel='Generar nuevo enlace';body='<div class="callout">'+icon('info')+'<span>Comparta el nuevo enlace y código únicamente con las personas que desea incorporar al grupo.</span></div>';
    }else if(type==='role'){
      const m=member(g,data.id);if(!m)return;title='Cambiar rol de participante';desc=`Actualice el rol de ${esc(m.name)}.`;submitLabel='Guardar rol';body=`<form id="roleForm"><div class="form-field"><label for="memberRole">Rol dentro del grupo</label><select id="memberRole" class="field"><option value="Miembro" ${m.role==='Miembro'?'selected':''}>Miembro</option><option value="Administrador" ${m.role==='Administrador'?'selected':''}>Administrador</option></select><small>Siempre debe quedar al menos una persona administradora.</small></div></form>`;
    }else if(type==='currency-confirm'){
      title='Corregir la moneda';desc='No se hará ninguna conversión de importes.';submitLabel='Cambiar moneda';const code=data.code;body=`<div class="callout">${icon('info')}<span>La moneda cambiará de <strong>${esc(g.currency)}</strong> a <strong>${esc(code)}</strong>. Los valores numéricos se mantienen; por ejemplo, 10 ${esc(g.currency)} se mostrarán como 10 ${esc(code)}. Esta opción es solo para corregir un error de captura.</span></div>`;
    }else if(type==='confirm-status'){
      title=g.status==='open'?'Cerrar el grupo':'Reabrir el grupo';desc=g.status==='open'?'El grupo pasará a solo lectura.':'Se volverán a permitir cambios.';submitLabel=g.status==='open'?'Cerrar grupo':'Reabrir grupo';body=`<p>${g.status==='open'?'Los gastos, saldos y la liquidación seguirán disponibles para consulta. Ninguna persona podrá escribir hasta que una persona administradora lo reabra.':'El grupo volverá a admitir gastos y modificaciones según los permisos de cada participante.'}</p>`;
    }else if(type==='delete-group'){
      title='Eliminar grupo';desc='Esta acción es permanente.';submitLabel='Eliminar grupo';body=`<div class="callout" style="background:var(--danger-soft)">${icon('info')}<span>Se eliminará <strong>${esc(g.name)}</strong>, junto con sus participantes y enlace de ingreso. Esta opción solo se permite cuando no existen gastos.</span></div>`;
    }else return;
    const modalActions=type==='expense-management-unsaved'
      ? `${btn('Seguir editando','stay-expense-management','btn-quiet')}${btn('Descartar y salir','discard-and-continue-expense-management','btn-danger')}${btn('Guardar y continuar','save-and-continue-expense-management','btn-primary','check')}`
      : `${btn('Cancelar','close-modal','btn-quiet')}${btn(submitLabel,'modal-submit',type==='delete-expense'||type==='delete-group'?'btn-danger':'btn-primary','')}`;
    modal.innerHTML=`<div class="modal-header"><div><h2 id="modalTitle">${title}</h2><p id="modalDescription">${desc}</p></div><button type="button" class="modal-close" data-action="close-modal" aria-label="Cerrar ventana">${icon('close')}</button></div><div class="modal-body">${body}</div><div class="modal-actions">${modalActions}</div>`;
    modal.setAttribute('aria-describedby','modalDescription');
    const back=$('#modalBackdrop');back.classList.add('open');back.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';
    setTimeout(()=>{const focus=$('input:not([type=hidden]):not([disabled]),select:not([disabled]),textarea:not([disabled]),button:not([disabled])',modal);if(focus)focus.focus();else modal.focus();},30);
  }
  const fromUnits=(units,code)=>{const d=currencyInfo[code].decimals;if(!d)return String(units);return `${Math.floor(units/100)}.${String(units%100).padStart(2,'0')}`;};
  function closeModal(){const closingType=state.modalType;const back=$('#modalBackdrop');back.classList.remove('open');back.setAttribute('aria-hidden','true');document.body.style.overflow='';state.modalType=null;if(closingType==='expense-management-unsaved')state.pendingExpenseManagementNavigation=null;if(state.previousFocus?.focus)state.previousFocus.focus();}
  function toast(message,type='ok'){const el=document.createElement('div');el.className=`toast ${type==='error'?'error':''}`;el.innerHTML=`${icon(type==='error'?'info':'check')}<span>${esc(message)}</span>`;$('#toastStack').append(el);setTimeout(()=>el.remove(),4200);}
  async function copyText(str){try{await navigator.clipboard.writeText(str);toast('Copiado al portapapeles.');}catch{const t=document.createElement('textarea');t.value=str;document.body.append(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch{}t.remove();toast(ok?'Copiado al portapapeles.':'El navegador no permitió copiarlo. Seleccione el texto y cópielo manualmente.',ok?'ok':'error');}}
  function submitModal(){const type=state.modalType,g=byId(state.groupId);
    if(type==='new-group'){
      const name=$('#newGroupName').value.trim(),desc=$('#newGroupDescription').value.trim();if(!name){$('#newNameField').classList.add('invalid');$('#newGroupName').focus();return;}
      const code=$('#newGroupCurrency').value;const ng={id:nextGroup++,name,description:desc,currency:code,timezone:$('#newGroupTimezone').value,status:'open',createdAt:today,inviteCode:String(Math.floor(1000+Math.random()*9000)),inviteToken:'prototipo-'+Math.random().toString(36).slice(2,11),members:[mkMember('leo','Leandro Mora','Administrador')],expenses:[]};state.groups.unshift(ng);state.groupId=ng.id;state.page='group';state.tab='overview';state.filter='';closeModal();render();toast('Grupo creado en el prototipo.');return;
    }
    if(type==='expense'){
      const f=$('#expenseForm'),id=f.dataset.expenseId,desc=$('#expenseDescription').value.trim(),amountRaw=$('#expenseAmount').value,date=$('#expenseDate').value,payer=$('#expensePayer').value;let valid=true;
      if(!desc){$('#expenseDescriptionField').classList.add('invalid');valid=false;}else $('#expenseDescriptionField').classList.remove('invalid');
      const parsed=parseAmount(amountRaw,g.currency);if(parsed.error){$('#expenseAmountError').textContent=parsed.error;$('#expenseAmountField').classList.add('invalid');valid=false;}else $('#expenseAmountField').classList.remove('invalid');
      if(!date){$('#expenseDateField').classList.add('invalid');valid=false;}else $('#expenseDateField').classList.remove('invalid');if(!valid)return;
      if(id){const e=g.expenses.find(x=>x.id===Number(id));if(e){e.description=desc;e.units=parsed.units;e.date=date;if(isAdmin(g))e.payer=payer;}}else g.expenses.push({id:nextExpense++,description:desc,units:parsed.units,date,payer});
      closeModal();render();toast(id?'Gasto actualizado.':'Gasto registrado. Saldos recalculados.');return;
    }
    if(type==='delete-expense') {const id=Number($('#modal').dataset.id||0);}
    if(type==='delete-expense'){
      const e=g.expenses.find(x=>x.id===Number($('#modal').getAttribute('data-target-id')));if(e)g.expenses=g.expenses.filter(x=>x.id!==e.id);closeModal();render();toast('Gasto eliminado. Los saldos fueron recalculados.');return;
    }
    if(type==='regenerate'){
      g.inviteCode=String(Math.floor(1000+Math.random()*9000));g.inviteToken='prototipo-'+Math.random().toString(36).slice(2,13);closeModal();render();toast('Enlace y código renovados; el anterior queda invalidado en esta demostración.');return;
    }
    if(type==='role'){
      const m=member(g,state.roleTarget);if(!m)return;const newRole=$('#memberRole').value;if(m.role==='Administrador'&&newRole!=='Administrador'&&g.members.filter(x=>x.role==='Administrador').length===1){toast('El grupo debe conservar al menos una persona administradora.','error');return;}m.role=newRole;closeModal();render();toast('Rol actualizado.');return;
    }
    if(type==='currency-confirm'){
      const code=state.pendingCurrency;if(!code)return;const dec=currencyInfo[code].decimals;if(dec===0&&g.expenses.some(e=>e.units%100!==0)){toast('No se puede cambiar la moneda: hay gastos con decimales incompatibles. No se modificó ningún importe.','error');state.pendingCurrency=null;closeModal();return;}g.currency=code;state.pendingCurrency=null;closeModal();render();toast('Moneda actualizada sin convertir los importes.');return;
    }
    if(type==='confirm-status'){g.status=g.status==='open'?'closed':'open';closeModal();render();toast(g.status==='open'?'Grupo reabierto.':'Grupo cerrado en modo de solo lectura.');return;}
    if(type==='delete-group'){if(g.expenses.length){toast('Primero elimine todos los gastos del grupo.','error');closeModal();return;}state.groups=state.groups.filter(x=>x.id!==g.id);state.page='groups';closeModal();render();toast('Grupo eliminado en la demostración.');return;}
  }
  // Store modal-specific payloads on state so the dialog remains simple and deterministic.
  const originalOpenModal=openModal;
  openModal=function(type,data={}){if(type==='delete-expense')state.deleteExpenseId=Number(data.id);if(type==='role')state.roleTarget=data.id;if(type==='currency-confirm')state.pendingCurrency=data.code;originalOpenModal(type,data);if(type==='delete-expense')$('#modal').setAttribute('data-target-id',String(data.id));};
  function scrollPageToTop(){
    const main=$('#mainContent');
    if(window.matchMedia('(max-width: 760px)').matches) main?.scrollTo({top:0,behavior:'smooth'});
    else window.scrollTo({top:0,behavior:'smooth'});
  }
  function openGroup(id){state.groupId=Number(id);state.page='group';state.tab='overview';state.filter='';state.expenseFilter='all';state.expandedPayers=[];render();scrollPageToTop();}
  document.addEventListener('click',e=>{
    const target=e.target.closest('button,[data-open-group]');if(!target)return;
    if(!$('#modalBackdrop').classList.contains('open')&&expenseManagementIsDirty()){
      const intent=navigationIntentFor(target);
      if(intent){e.preventDefault();requestExpenseManagementNavigation(intent);return;}
    }
    if(target.dataset.groupFilter){state.groupStatusFilter=target.dataset.groupFilter;render();return;}
    if(target.dataset.openGroup){openGroup(target.dataset.openGroup);return;}
    if(target.dataset.nav){if(target.dataset.nav==='groups'){state.page='groups';state.filter='';render();}else if(target.dataset.nav==='help'){state.page='help';render();}else if(target.dataset.nav==='profile'){state.page='profile';render();}scrollPageToTop();return;}
    if(target.dataset.tab){const val=target.dataset.tab;const cameFromTab=target.matches('[role="tab"]');switchGroupTab(val,cameFromTab);return;}
    const a=target.dataset.action;if(!a)return;
    if(a==='stay-expense-management'){state.pendingExpenseManagementNavigation=null;closeModal();}
    else if(a==='discard-and-continue-expense-management'){
      const intent=state.pendingExpenseManagementNavigation;state.pendingExpenseManagementNavigation=null;state.expenseManagementDraft=null;state.expenseManagementDirty=false;state.expenseManagementErrors=null;closeModal();performExpenseManagementNavigation(intent);
    }
    else if(a==='save-and-continue-expense-management')commitExpenseManagement(true)
    else if(a==='add-expense-row')addExpenseManagementRow()
    else if(a==='remove-management-row')removeExpenseManagementRow(target.dataset.rowKey)
    else if(a==='save-expense-management')commitExpenseManagement(false)
    else if(a==='discard-expense-management')requestExpenseManagementNavigation({kind:'stay'})
    else if(a==='clear-group-filters'){state.filter='';state.groupStatusFilter='all';render();}
    else if(a==='new-group')openModal('new-group');
    else if(a==='new-expense'){const g=byId(state.groupId);if(g.status==='closed'){toast('El grupo está cerrado. Una persona administradora debe reabrirlo antes de registrar gastos.','error');return;}openModal('expense');}
    else if(a==='edit-expense'){const g=byId(state.groupId),e=g.expenses.find(x=>x.id===Number(target.dataset.id));if(!e)return;if(!isAdmin(g)&&e.payer!==me){toast('Solo puede editar los gastos que usted pagó.','error');return;}openModal('expense',{expense:e.id});}
    else if(a==='delete-expense'){openModal('delete-expense',{id:target.dataset.id});}
    else if(a==='tab-expenses')switchGroupTab('expenses')
    else if(a==='tab-settlement')switchGroupTab('settlement')
    else if(a==='tab-settings')switchGroupTab('settings')
    else if(a==='back-groups'){state.page='groups';state.filter='';render();scrollPageToTop();}
    else if(a==='close-modal')closeModal();
    else if(a==='modal-submit')submitModal();
    else if(a==='copy-link'){const g=byId(state.groupId);copyText(`https://pastel.local/balance/ingresar#${g.inviteToken}`);}
    else if(a==='copy-invite'){const g=byId(state.groupId);copyText(`Enlace para unirse a ${g.name}: https://pastel.local/balance/ingresar#${g.inviteToken}\nCódigo: ${g.inviteCode}`);}
    else if(a==='regenerate-invite')openModal('regenerate');
    else if(a==='member-role'){openModal('role',{id:target.dataset.id});}
    else if(a==='save-group-settings'){
      e.preventDefault();const g=byId(state.groupId),name=$('#settingsName').value.trim(),desc=$('#settingsDescription').value.trim(),code=$('#settingsCurrency').value,timezone=$('#settingsTimezone').value;if(!name){$('#settingsName').focus();toast('Ingrese un nombre para el grupo.','error');return;}if(code!==g.currency){state.pendingSettings={name,desc,code,timezone};const incompatible=currencyInfo[code].decimals===0&&g.expenses.some(x=>x.units%100!==0);if(incompatible){toast('No se puede cambiar la moneda: existen importes con centavos que la moneda nueva no admite.','error');return;}openModal('currency-confirm',{code});return;}g.name=name;g.description=desc;g.timezone=timezone;render();toast('Configuración guardada.');
    }
    else if(a==='toggle-group-status')openModal('confirm-status');
    else if(a==='delete-group')openModal('delete-group');
    else if(a==='help'){state.page='help';render();}
    else if(a==='profile'){state.page='profile';render();}
    else if(a==='toggle-theme')toggleTheme();
  });
  $('#modalBackdrop').addEventListener('click',e=>{if(e.target===$('#modalBackdrop'))closeModal();});
  document.addEventListener('keydown',e=>{
    const modalOpen=$('#modalBackdrop').classList.contains('open');
    if(modalOpen&&e.key==='Escape'){e.preventDefault();closeModal();return;}
    if(modalOpen&&e.key==='Tab'){
      const modal=$('#modal');
      const focusable=[...modal.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(el=>el.getClientRects().length>0);
      if(!focusable.length){e.preventDefault();modal.focus();return;}
      const first=focusable[0],last=focusable[focusable.length-1];
      if(!modal.contains(document.activeElement)){e.preventDefault();(e.shiftKey?last:first).focus();}
      else if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
      return;
    }
    if(!modalOpen&&e.target.matches('[role="tab"]')&&['ArrowRight','ArrowLeft','Home','End'].includes(e.key)){
      const tabs=$$('.group-tabs [role="tab"]');const current=tabs.indexOf(e.target);if(!tabs.length||current<0)return;
      let next=current;if(e.key==='ArrowRight')next=(current+1)%tabs.length;else if(e.key==='ArrowLeft')next=(current-1+tabs.length)%tabs.length;else if(e.key==='Home')next=0;else if(e.key==='End')next=tabs.length-1;
      e.preventDefault();const targetTab=tabs[next];const value=targetTab.dataset.tab;
      if(expenseManagementIsDirty()&&value!==state.tab){requestExpenseManagementNavigation({kind:'tab',value});return;}
      switchGroupTab(value,true);return;
    }
    if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-open-group]')){e.preventDefault();openGroup(e.target.dataset.openGroup);}
  });
  document.addEventListener('input',e=>{
    if(e.target.matches('[data-management-field]')){markExpenseManagementDirty(e.target);return;}
    if(e.target.id==='groupSearch'){state.filter=e.target.value;const pos=e.target.selectionStart;render();const input=$('#groupSearch');if(input){input.focus();input.setSelectionRange(pos,pos);}return;}
    if(e.target.id==='expenseSearch'){state.filter=e.target.value;const pos=e.target.selectionStart;const main=$('#mainContent');const start=main.scrollTop;render();const input=$('#expenseSearch');if(input){input.focus();input.setSelectionRange(pos,pos);}main.scrollTop=start;return;}
  });
  document.addEventListener('change',e=>{if(e.target.matches('[data-management-field]')){markExpenseManagementDirty(e.target);return;}if(e.target.id==='expenseFilter'){state.expenseFilter=e.target.value;render();}else if(e.target.id==='expenseSort'){state.expenseSort=e.target.value;render();}});
  document.addEventListener('toggle',e=>{if(!e.target.matches('.participant-accordion'))return;const id=e.target.dataset.payerId;if(!id)return;state.expandedPayers=e.target.open?[...new Set([...state.expandedPayers,id])]:state.expandedPayers.filter(x=>x!==id);},true);
  const themeToggle=$('#themeToggle');const sunPath='<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>';const moonPath='<path d="M20.8 13A8.5 8.5 0 0 1 11 3.2 8.7 8.7 0 1 0 20.8 13Z"/>';function syncThemeButton(){const dark=document.documentElement.dataset.theme==='dark';$('#themeIcon').innerHTML=dark?sunPath:moonPath;themeToggle.title=dark?'Usar tema claro':'Usar tema oscuro';themeToggle.setAttribute('aria-label',themeToggle.title);}function toggleTheme(){const root=document.documentElement;const next=root.dataset.theme==='dark'?'light':'dark';root.dataset.theme=next;syncThemeButton();try{localStorage.setItem('pastel.balance.theme',next);}catch{ /* El tema sigue activo durante esta sesión. */ }}syncThemeButton();
  themeToggle.addEventListener('click',toggleTheme);
  const baseSubmitModal=submitModal;
  submitModal=function(){
    if(state.modalType==='delete-expense'){
      const g=byId(state.groupId);g.expenses=g.expenses.filter(x=>x.id!==state.deleteExpenseId);state.deleteExpenseId=null;closeModal();render();toast('Gasto eliminado. Los saldos fueron recalculados.');return;
    }
    if(state.modalType==='currency-confirm'){
      const g=byId(state.groupId),pending=state.pendingSettings;if(pending){const oldDigits=currencyInfo[g.currency].decimals,newDigits=currencyInfo[pending.code].decimals;if(newDigits<oldDigits&&g.expenses.some(x=>x.units%(10**(oldDigits-newDigits))!==0)){toast('No se puede cambiar la moneda: existen importes con decimales incompatibles. No se modificó ningún dato.','error');state.pendingSettings=null;closeModal();return;}if(newDigits!==oldDigits){const factor=10**(newDigits-oldDigits);g.expenses.forEach(x=>x.units*=factor);}g.name=pending.name;g.description=pending.desc;g.currency=pending.code;g.timezone=pending.timezone;state.pendingSettings=null;state.pendingCurrency=null;closeModal();render();toast('Configuración actualizada sin convertir los importes.');return;}
    }
    baseSubmitModal();
  };
  render();
})();
