name: pastel-admin

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: .
      dockerfile: src/Host/Pastel.Host/Dockerfile
      args:
        PASTEL_MODULES: ${PASTEL_MODULES:-*}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=${POSTGRES_HOST:?Set POSTGRES_HOST to a reachable PostgreSQL host};Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:-pastel};Username=${POSTGRES_USER:-pastel};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD};GSS Encryption Mode=${POSTGRES_GSS_ENCRYPTION_MODE:-Disable}
      Database__ApplyMigrationsAtStartup: ${DATABASE_APPLY_MIGRATIONS_AT_STARTUP:-true}
      Jwt__Issuer: PastelAdmin
      Jwt__Audience: PastelAdmin.Web
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Jwt__SigningKeyId: ${JWT_SIGNING_KEY_ID:-primary}
      Jwt__PreviousSigningKey: ${JWT_PREVIOUS_SIGNING_KEY:-}
      Jwt__PreviousSigningKeyId: ${JWT_PREVIOUS_SIGNING_KEY_ID:-}
      Bootstrap__AdminEmail: ${BOOTSTRAP_ADMIN_EMAIL:-admin@pastel.local}
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env}
      # Cuentas QA con contraseña conocida; habilitar solo para Development/Testing.
      TestingSeed__Enabled: ${TESTING_SEED_ENABLED:-true}
      # CIDR de la red del proxy de confianza; los contenedores usan IPs dinámicas.
      ReverseProxy__TrustedNetworks: ${REVERSE_PROXY_TRUSTED_NETWORKS:-172.30.0.0/24}
      App__PublicBaseUrl: ${APP_PUBLIC_BASE_URL:-http://localhost:${WEB_PORT:-8080}}
      AllowedHosts: ${ALLOWED_HOSTS:-localhost;127.0.0.1}
      Auth__Local__Enabled: ${AUTH_LOCAL_ENABLED:-true}
      Auth__Local__SelfRegistrationEnabled: ${AUTH_LOCAL_SELF_REGISTRATION_ENABLED:-false}
      Auth__Refresh__ReuseGraceSeconds: ${AUTH_REFRESH_REUSE_GRACE_SECONDS:-10}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Auth__Google__AllowSignUp: ${AUTH_GOOGLE_ALLOW_SIGNUP:-true}
      Identity__Retention__ExpiredRefreshTokenDays: ${EXPIRED_REFRESH_TOKEN_DAYS:-30}
      Identity__Retention__AuditLogRetentionDays: ${AUDIT_LOG_RETENTION_DAYS:-365}
      Identity__Retention__CleanupIntervalHours: ${IDENTITY_CLEANUP_INTERVAL_HOURS:-24}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s
    networks:
      - pastel_net
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: 1.50
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        PASTEL_MODULES: ${PASTEL_MODULES:-*}
    restart: unless-stopped
    environment:
      NGINX_ENVSUBST_FILTER: "^NGINX_TRUSTED_PROXY_CIDR$"
      NGINX_TRUSTED_PROXY_CIDR: ${NGINX_TRUSTED_PROXY_CIDR:-192.0.2.0/24}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health/web || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    networks:
      - pastel_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 160m
    cpus: 0.50
    logging: *default-logging

networks:
  pastel_net:
    driver: bridge
    ipam:
      config:
        # Stable subnet for trusted-network configuration; individual container IPs are dynamic.
        - subnet: 172.30.0.0/24
